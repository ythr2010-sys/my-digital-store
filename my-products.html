<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة منتجاتي | الخزنة الرقمية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#090912;--card:#151524;--line:rgba(255,255,255,.09);--cyan:#00d2ff;--green:#4cffaa;--yellow:#ffd84d;--red:#ff8793;--sub:#a0a0c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#15152a 0,#090912 45%);color:#fff;font-family:Tajawal,sans-serif}.wrap{max-width:1100px;margin:25px auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.top h1{margin:0}.top a,.btn{display:inline-block;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:800;border:1px solid var(--line);color:#fff;background:#202034}.top a{color:var(--cyan);border-color:rgba(0,210,255,.35)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:1.7rem;margin-top:5px}.sub{color:var(--sub);font-size:.88rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{background:#10101b;color:#fff;border:1px solid var(--line);padding:10px;border-radius:9px;font-family:inherit}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:13px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.thumbs img{width:82px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.status{display:inline-block;padding:5px 10px;border-radius:999px;font-size:.8rem;font-weight:800}.pending{background:#3b3200;color:var(--yellow)}.approved{background:#073b25;color:var(--green)}.rejected{background:#3d1118;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.edit{color:var(--cyan);border-color:rgba(0,210,255,.4)}.open{color:var(--green);border-color:rgba(76,255,170,.4)}.reason{background:rgba(255,51,102,.08);border:1px solid rgba(255,51,102,.3);padding:11px;border-radius:10px;margin-top:12px}.empty{text-align:center;padding:50px;color:var(--sub)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>📦 لوحة منتجاتي</h1><p class="sub">راقب حالة منتجاتك، عدّلها، وأعد إرسال المرفوض منها للمراجعة.</p></div><div><a href="index.html">🏠 الرئيسية</a> <a href="add-product.html">➕ منتج جديد</a></div></div><section class="stats"><div class="stat">كل المنتجات<b id="all">—</b></div><div class="stat">بانتظار المراجعة<b id="pending">—</b></div><div class="stat">منشورة<b id="approved">—</b></div><div class="stat">مرفوضة<b id="rejected">—</b></div><div class="stat">مبيعات مكتملة<b id="salesCount">—</b></div><div class="stat">إجمالي المبيعات<b id="salesTotal">—</b></div></section><div class="toolbar"><input id="search" placeholder="🔎 ابحث باسم المنتج"><select id="filter"><option value="all">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="approved">منشور</option><option value="rejected">مرفوض</option></select><button class="btn" id="refresh">🔄 تحديث</button></div><div id="list" class="empty">جاري التحميل...</div></main><script type="module">import{auth,db,esc}from'./firebase-init.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';let user=null,all=[],sales=[];const $=id=>document.getElementById(id);function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const arr=all.filter(p=>(f==='all'||p.status===f)&&((p.title||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)));$('all').textContent=all.length;$('pending').textContent=all.filter(p=>p.status==='pending').length;$('approved').textContent=all.filter(p=>p.status==='approved').length;$('rejected').textContent=all.filter(p=>p.status==='rejected').length;const total=sales.reduce((sum,x)=>{const n=parseFloat(String(x.price??0).replace(/[^0-9.-]/g,''));return sum+(Number.isFinite(n)?n:0)},0);$('salesCount').textContent=sales.length;$('salesTotal').textContent=total.toFixed(2)+' $';if(!arr.length){$('list').innerHTML='<div class="empty">لا توجد منتجات مطابقة.</div>';return}$('list').innerHTML=arr.map(p=>{const st=p.status||'pending',label=st==='approved'?'مقبول ومنشور':st==='rejected'?'مرفوض':'بانتظار المراجعة';const imgs=p.imageUrls||((p.imageUrl)?[p.imageUrl]:[]);return `<article class="card"><div class="head"><div><h2>${esc(p.title||'منتج بدون عنوان')}</h2><span class="status ${st}">${label}</span></div><span class="sub">${esc(p.category||'غير مصنف')} · ${esc(p.price||'')}</span></div>${imgs.length?`<div class="thumbs">${imgs.slice(0,6).map(u=>`<img src="${esc(u)}" onerror="this.style.display='none'">`).join('')}</div>`:''}${st==='rejected'&&p.rejectionReason?`<div class="reason"><strong>سبب الرفض:</strong> ${esc(p.rejectionReason)}<br><span class="sub">صحّح المشكلة ثم اضغط تعديل وإعادة إرسال.</span></div>`:''}<p class="sub">📁 ملف المنتج: محفوظ/رابط خارجي حسب إعداد المنتج · آخر تحديث: ${p.updatedAt?.toDate?p.updatedAt.toDate().toLocaleString('ar-DZ'):p.createdAt?.toDate?p.createdAt.toDate().toLocaleString('ar-DZ'):'—'}</p><div class="actions"><a class="btn edit" href="edit-product.html?id=${encodeURIComponent(p.id)}">✏️ تعديل وتحديث</a><a class="btn open" href="product.html?id=${encodeURIComponent(p.id)}">👁️ فتح المنتج</a></div></article>`}).join('')}async function load(){if(!user)return;const list=$('list');list.className='empty';list.textContent='جاري تحديث المنتجات...';try{const snap=await getDocs(query(collection(db,'products'),where('sellerEmail','==',user.email)));all=[];snap.forEach(d=>all.push({id:d.id,...d.data()}));all.sort((a,b)=>(b.updatedAt?.toMillis?.()||b.createdAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||a.createdAt?.toMillis?.()||0));try{const os=await getDocs(query(collection(db,'orders'),where('status','==','completed')));sales=[];os.forEach(d=>{const o=d.data();for(const item of (o.items||[])){if(item.sellerEmail===user.email||item.seller===user.email)sales.push(item)}})}catch(_){sales=[]}render()}catch(e){list.innerHTML=`<div class="empty">تعذر تحميل منتجاتك.<br><small>${esc(e.message||'تحقق من Firestore Rules')}</small></div>`}}$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',load);onAuthStateChanged(auth,u=>{user=u;if(!u){$('list').innerHTML='<div class="empty">سجّل الدخول أولاً.</div>';return}load()});</script><script type="module" src="./site-enhance.js"></script></body></html>
