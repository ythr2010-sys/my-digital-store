<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتجاتي وحالتها | الخزنة الرقمية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a12;--card:#141424;--line:rgba(255,255,255,.08);--cyan:#00d2ff;--sub:#a0a0c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Tajawal,sans-serif}.wrap{max-width:1000px;margin:40px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top a{color:var(--cyan);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}.status{display:inline-block;padding:5px 10px;border-radius:999px;font-size:.82rem;font-weight:800}.pending{background:#3b3200;color:#ffd84d}.approved{background:#073b25;color:#4cffaa}.rejected{background:#3d1118;color:#ff8793}.meta{color:var(--sub);font-size:.9rem}.empty{text-align:center;padding:50px;color:var(--sub)}</style></head><body><main class="wrap"><div class="top"><h1>📦 منتجاتي وحالتها</h1><a href="add-product.html">➕ إضافة منتج</a></div><div id="list" class="empty">جاري التحميل...</div></main><script type="module">import{auth,db,esc}from'./firebase-init.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';onAuthStateChanged(auth,async u=>{const list=document.getElementById('list');if(!u?.email){list.innerHTML='<div class="empty">سجّل الدخول لعرض منتجاتك.</div>';return}try{const snap=await getDocs(query(collection(db,'products'),where('sellerEmail','==',u.email)));const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));arr.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));if(!arr.length){list.innerHTML='<div class="empty">لم ترسل أي منتج بعد.</div>';return}list.innerHTML=arr.map(p=>{const st=p.status||'pending',label=st==='approved'?'مقبول ومنشور':st==='rejected'?'مرفوض':'بانتظار المراجعة';return `<article class="card"><h2>${esc(p.title||'منتج بدون عنوان')}</h2><span class="status ${st}">${label}</span><p class="meta">السعر: ${esc(p.price||'')} · التصنيف: ${esc(p.category||'')}</p>${st==='rejected'&&p.rejectionReason?`<p>سبب الرفض: <strong>${esc(p.rejectionReason)}</strong></p>`:''}<p class="meta">المنتج محفوظ هنا ولا يُحذف تلقائياً عند صدور القرار.</p></article>`}).join('')}catch(e){list.innerHTML='<div class="empty">تعذر تحميل المنتجات. تحقق من قواعد Firestore.</div>'}});</script><script type="module" src="./site-enhance.js"></script></body></html>
