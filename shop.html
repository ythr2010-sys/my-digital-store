<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المنتجات الرقمية | الخزنة الرقمية</title>
    <meta name="description" content="تصفح واشترِ أحدث الكتب الإلكترونية، مجسمات 3D/2D، الدورات التعليمية والبطاقات الرقمية بحرية أمان وتسليم فوري.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }
        
        .page-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-line);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu li a, .sidebar-menu li button {
            display: flex; align-items: center; gap: 12px; color: var(--text-sub);
            text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; transition: 0.3s;
            width: 100%; border: none; background: transparent; font-family: inherit; font-size: 1rem; cursor: pointer;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); border-right: 3px solid var(--accent-cyan);
        }

        .btn-logout-sidebar { color: var(--danger-red) !important; }
        .btn-logout-sidebar:hover {
            background: rgba(255, 71, 87, 0.1) !important;
            border-right: 3px solid var(--danger-red) !important;
        }

        .main-content { flex: 1; padding: 30px; overflow-x: hidden; }

        /* شريط البحث والتصفية */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        /* Filter Tabs */
        .filter-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .product-image-container {
            width: 100%;
            height: 160px;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #1e1e24;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            align-self: flex-start;
            background: rgba(138, 43, 226, 0.2);
            color: #c084fc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .product-desc { 
            font-size: 0.85rem; 
            color: var(--text-sub); 
            margin-bottom: 15px; 
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid var(--border-line);
            padding-top: 12px;
        }

        .product-price { font-size: 1.2rem; font-weight: 900; color: #10b981; }
        .btn-add {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff; border: none; padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s;
        }
        .btn-add:hover { opacity: 0.9; transform: scale(1.05); }

        /* نافذة التفاصيل (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,210,255,0.2);
            animation: fadeIn 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 15px; left: 20px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover { color: var(--danger-red); }

        /* اشعار صغير سريع */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--accent-cyan);
            color: #000;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 3000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .page-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo"><a href="index.html" style="font-size:1.5rem; font-weight:900; color:#fff; text-decoration:none;">الخزنة<span style="color:var(--accent-cyan);">الرقمية</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">🏠 الصفحة الرئيسية</a></li>
                <li><a href="shop.html" class="active">🛍️ تسوق الآن (المنتجات)</a></li>
                <li><a href="contact.html">📩 تواصل معنا والأسئلة</a></li>
                <li><a href="profile.html">🛒 سلة المشتريات والحساب</a></li>
                <li><a href="privacy.html">🔒 سياسة الخصوصية</a></li>
                
                <li id="loginMenuLi">
                    <a href="login.html">🔑 تسجيل الدخول</a>
                </li>
                <li id="adminMenuLi" style="display: none;">
                    <a href="admin.html" style="color: var(--accent-cyan); font-weight: bold;">👑 لوحة التحكم (Admin)</a>
                </li>
                <li id="logoutMenuLi" style="display: none;">
                    <button onclick="logoutUser()" class="btn-logout-sidebar">🚪 تسجيل الخروج</button>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 20px; font-size: 1.8rem;">كتالوج المنتجات الرقمية 📦</h1>

            <!-- شريط البحث السريع -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن كتاب، مجسم 3D، أو دورة تعليمية..." oninput="handleFilterAndSearch()">
            </div>

            <!-- شريط تصنيف المنتجات -->
            <div class="filter-container">
                <button class="filter-btn active" data-cat="all" onclick="filterCategory('all', event)">الكل</button>
                <button class="filter-btn" data-cat="books" onclick="filterCategory('books', event)">📚 كتب وروايات</button>
                <button class="filter-btn" data-cat="models" onclick="filterCategory('models', event)">🎨 مجسمات 3D/2D</button>
                <button class="filter-btn" data-cat="courses" onclick="filterCategory('courses', event)">🎓 دورات فيديو</button>
                <button class="filter-btn" data-cat="gaming" onclick="filterCategory('gaming', event)">🎮 ألعاب واشتراكات</button>
            </div>

            <!-- شبكة عرض المنتجات -->
            <div class="products-grid" id="productsGrid">
                <p style="color: var(--text-sub); grid-column: 1/-1; text-align: center; padding: 30px;">جاري تحميل المنتجات...</p>
            </div>
        </main>
    </div>

    <!-- نافذة التفاصيل (Modal) -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <span class="product-badge" id="modalBadge"></span>
            <h2 id="modalTitle" style="margin-bottom: 10px; color:#fff;"></h2>
            <p id="modalDesc" style="color: var(--text-sub); margin-bottom: 20px; font-size:0.95rem;"></p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="modalPrice" class="product-price"></span>
                <button id="modalAddBtn" class="btn-add">إضافة للسلة 🛒</button>
            </div>
        </div>
    </div>

    <!-- عنصر التنبيه السريع عند الإضافة -->
    <div id="toast" class="toast-notification"></div>

    <!-- كود الجلب وتشغيل المتجر -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClXL28rqPQr--pUu3N_Y-X3ihXEAKOyg8",
            authDomain: "digivault-4c3a3.firebaseapp.com",
            projectId: "digivault-4c3a3",
            storageBucket: "digivault-4c3a3.firebasestorage.app",
            messagingSenderId: "578335534171",
            appId: "1:578335534171:web:1b108a849c0543f998a37e",
            measurementId: "G-SZCB59ZZDN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentCategory = 'all';
        let allProductsCache = [];

        // قائمة المنتجات الافتراضية
        const defaultProducts = [
            { id: 1, title: "كتاب أساسيات البرمجة بلغة Python", cat: "books", badge: "كتاب PDF", desc: "دليل شامل للمبتدئين لتعلم البرمجة وتطوير السكربتات من الصفر.", price: "9.99", imgUrl: "https://via.placeholder.com/300x160?text=Python+Book", fileUrl: "#" },
            { id: 2, title: "رواية ظلال الخزنة الرقمية", cat: "books", badge: "رواية إلكترونية", desc: "رواية خيال علمي وتشويق تقني مشوقة جدًا.", price: "4.99", imgUrl: "https://via.placeholder.com/300x160?text=Novel", fileUrl: "#" },
            { id: 3, title: "حزمة مجسمات 3D أسلحة عالية الدقة", cat: "models", badge: "ملفات Blender/FBX", desc: "أصول 3D جاهزة للاستخدام في محركات الألعاب مثل Godot وUnity.", price: "19.99", imgUrl: "https://via.placeholder.com/300x160?text=3D+Models", fileUrl: "#" },
            { id: 4, title: "مجموعة أيقونات وواجهات 2D Cyberpunk", cat: "models", badge: "تصاميم PNG/SVG", desc: "تصاميم وأيقونات احترافية لتطوير الألعاب والواجهات.", price: "7.50", imgUrl: "https://via.placeholder.com/300x160?text=UI+Pack", fileUrl: "#" },
            { id: 5, title: "دورة تطوير الألعاب عبر Godot Engine", cat: "courses", badge: "سلسلة فيديوهات", desc: "شرح كامل لبناء لعبة FPS ثلاثية الأبعاد خطوة بخطوة.", price: "29.99", imgUrl: "https://via.placeholder.com/300x160?text=Godot+Course", fileUrl: "#" },
            { id: 6, title: "دورة الأمن السيبراني واختبار الاختراق", cat: "courses", badge: "دورة تعليمية", desc: "تعلم أساسيات الحماية والمختبرات الافتراضية Kali Linux.", price: "34.99", imgUrl: "https://via.placeholder.com/300x160?text=Cybersecurity", fileUrl: "#" },
            { id: 7, title: "بطاقة شحن رقمية 500 eFootball Coins", cat: "gaming", badge: "كود فوري", desc: "كود شحن فوري وآمن لحسابك.", price: "5.00", imgUrl: "https://via.placeholder.com/300x160?text=eFootball", fileUrl: "#" },
            { id: 8, title: "اشتراك شحن العاب وتفعيل سيرفرات", cat: "gaming", badge: "بطاقة رقمية", desc: "بطاقة تفعيل اشتراكات وخدمات رقمية متنوعة.", price: "12.00", imgUrl: "https://via.placeholder.com/300x160?text=Gaming+Sub", fileUrl: "#" }
        ];

        // جلب المنتجات من Firestore ومن LocalStorage ودمجها
        async function fetchAllProducts() {
            let fetchedProducts = [...defaultProducts];

            // 1. جلب من Firebase Firestore
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    fetchedProducts.push({
                        id: docSnap.id,
                        title: data.title || "منتج بدون عنوان",
                        cat: data.cat || "books",
                        badge: data.badge || 'منتج رقمي',
                        desc: data.description || data.desc || "لا يوجد وصف.",
                        price: data.price || "0.00",
                        imgUrl: data.imageUrl || data.imgUrl || "https://via.placeholder.com/300x160?text=DigiVault",
                        fileUrl: data.downloadUrl || data.fileUrl || "#"
                    });
                });
            } catch (error) {
                console.warn("تنبيه: تعذر الاتصال بـ Firestore، يتم استخدام المنتجات المحلية.", error);
            }

            // 2. جلب من LocalStorage (المنتجات المضافة محلياً)
            const customProducts = JSON.parse(localStorage.getItem("adminProducts")) || [];
            customProducts.forEach(p => {
                fetchedProducts.push({
                    id: p.id || Math.random().toString(),
                    title: p.title || "منتج محلي",
                    cat: p.cat || "books",
                    badge: p.badge || 'منتج محلي',
                    desc: p.desc || p.description || "لا يوجد وصف.",
                    price: p.price || "0.00",
                    imgUrl: p.imgUrl || p.imageUrl || "https://via.placeholder.com/300x160?text=DigiVault",
                    fileUrl: p.fileUrl || p.downloadUrl || "#"
                });
            });

            allProductsCache = fetchedProducts;
            handleFilterAndSearch();
        }

        window.renderProducts = function(items) {
            const grid = document.getElementById("productsGrid");
            if (!grid) return;

            if (items.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-sub); grid-column: 1/-1; text-align:center; padding: 40px;">لا توجد منتجات مطابقة لعملية البحث.</p>`;
                return;
            }

            grid.innerHTML = items.map(p => {
                const priceFormatted = String(p.price).includes('$') ? p.price : '$' + p.price;
                return `
                    <div class="product-card" onclick="openModal('${p.id}')">
                        <div>
                            <div class="product-image-container">
                                <img src="${p.imgUrl}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x160?text=DigiVault'" alt="${p.title}">
                            </div>
                            <span class="product-badge">${p.badge || 'منتج رقمي'}</span>
                            <h3 class="product-title">${p.title}</h3>
                            <p class="product-desc">${p.desc}</p>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">${priceFormatted}</span>
                            <button class="btn-add" onclick="event.stopPropagation(); addToCart('${p.title.replace(/'/g, "\\'")}', '${p.price}', '${p.fileUrl || '#'}')">إضافة للسلة 🛒</button>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.handleFilterAndSearch = function() {
            const queryInput = document.getElementById("searchInput");
            const query = queryInput ? queryInput.value.toLowerCase().trim() : "";
            
            const filtered = allProductsCache.filter(p => {
                const matchesCat = (currentCategory === 'all' || p.cat === currentCategory);
                const matchesSearch = p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            window.renderProducts(filtered);
        };

        window.filterCategory = function(cat, evt) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            if (evt && evt.target) {
                evt.target.classList.add('active');
            } else {
                const targetBtn = document.querySelector(`.filter-btn[data-cat="${cat}"]`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            window.handleFilterAndSearch();
        };

        window.openModal = function(id) {
            const item = allProductsCache.find(p => String(p.id) === String(id));
            if (!item) return;

            document.getElementById("modalBadge").textContent = item.badge || 'منتج رقمي';
            document.getElementById("modalTitle").textContent = item.title;
            document.getElementById("modalDesc").textContent = item.desc;
            document.getElementById("modalPrice").textContent = String(item.price).includes('$') ? item.price : '$' + item.price;
            
            const modalAddBtn = document.getElementById("modalAddBtn");
            modalAddBtn.onclick = () => {
                window.addToCart(item.title, item.price, item.fileUrl || '#');
                window.closeModal();
            };

            document.getElementById("productModal").style.display = "flex";
        };

        window.closeModal = function() {
            document.getElementById("productModal").style.display = "none";
        };

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            if (!toast) return;
            toast.textContent = message;
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.display = "none";
            }, 2500);
        };

        window.addToCart = function(name, price, fileUrl) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push({ name, price, fileUrl });
            localStorage.setItem("cart", JSON.stringify(cart));

            const userProfile = JSON.parse(localStorage.getItem("userProfile")) || {};
            let orders = JSON.parse(localStorage.getItem("siteOrders")) || [];
            
            orders.push({
                id: Date.now(),
                customerEmail: userProfile.email || 'زائر جديد',
                productTitle: name,
                price: price,
                status: 'قيد المعالجة',
                date: new Date().toLocaleDateString('ar-EG')
            });
            localStorage.setItem("siteOrders", JSON.stringify(orders));

            window.showToast(`تمت إضافة "${name}" إلى السلة 🛒`);
        };

        function checkAuthStatus() {
            const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
            const userProfile = JSON.parse(localStorage.getItem("userProfile")) || {};
            const helperAdmins = JSON.parse(localStorage.getItem("helperAdmins")) || [];
            const SUPER_ADMIN_EMAIL = "ythr2010@gmail.com";
            
            const loginLi = document.getElementById("loginMenuLi");
            const logoutLi = document.getElementById("logoutMenuLi");
            const adminLi = document.getElementById("adminMenuLi");

            const email = userProfile.email ? userProfile.email.toLowerCase() : "";
            const isAdmin = isLoggedIn && (userProfile.role === "admin" || email === SUPER_ADMIN_EMAIL.toLowerCase() || helperAdmins.includes(email));

            if (isLoggedIn) {
                if (loginLi) loginLi.style.display = "none";
                if (logoutLi) logoutLi.style.display = "block";
                if (isAdmin && adminLi) {
                    adminLi.style.display = "block";
                }
            } else {
                if (loginLi) loginLi.style.display = "block";
                if (logoutLi) logoutLi.style.display = "none";
                if (adminLi) adminLi.style.display = "none";
            }
        }

        window.logoutUser = function() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userProfile");
            sessionStorage.clear();
            alert("تم تسجيل الخروج بنجاح!");
            window.location.href = "index.html";
        };

        document.addEventListener("DOMContentLoaded", () => {
            checkAuthStatus();
            fetchAllProducts();

            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get('cat');
            if (categoryParam) {
                window.filterCategory(categoryParam);
            }
        });
    </script>
</body>
</html>
