<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المنتجات الرقمية | الخزنة الرقمية</title>
    <meta name="description" content="تصفح واشترِ أحدث الكتب الإلكترونية، مجسمات 3D/2D، الدورات التعليمية والبطاقات الرقمية بحرية أمان وتسليم فوري.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }
        
        .page-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-line);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu li a, .sidebar-menu li button {
            display: flex; align-items: center; gap: 12px; color: var(--text-sub);
            text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; transition: 0.3s;
            width: 100%; border: none; background: transparent; font-family: inherit; font-size: 1rem; cursor: pointer;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); border-right: 3px solid var(--accent-cyan);
        }

        .btn-logout-sidebar { color: var(--danger-red) !important; }
        .btn-logout-sidebar:hover {
            background: rgba(255, 71, 87, 0.1) !important;
            border-right: 3px solid var(--danger-red) !important;
        }

        .main-content { flex: 1; padding: 30px; }

        /* شريط البحث والتصفية */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        /* Filter Tabs */
        .filter-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-5px);
        }

        .product-badge {
            align-self: flex-start;
            background: rgba(138, 43, 226, 0.2);
            color: #c084fc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .product-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
        .product-desc { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 15px; }
        
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            border-top: 1px solid var(--border-line);
            padding-top: 12px;
        }

        .product-price { font-size: 1.2rem; font-weight: 900; color: var(--accent-cyan); }
        .btn-add {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff; border: none; padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s;
        }
        .btn-add:hover { opacity: 0.9; transform: scale(1.05); }

        /* نافذة التفاصيل (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,210,255,0.2);
            animation: fadeIn 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 15px; left: 20px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover { color: var(--danger-red); }

        /* اشعار صغير سريع */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--accent-cyan);
            color: #000;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 3000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .page-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo"><a href="index.html" style="font-size:1.5rem; font-weight:900; color:#fff; text-decoration:none;">الخزنة<span style="color:var(--accent-cyan);">الرقمية</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">🏠 الصفحة الرئيسية</a></li>
                <li><a href="shop.html" class="active">🛍️ تسوق الآن (المنتجات)</a></li>
                <li><a href="contact.html">📩 تواصل معنا والأسئلة</a></li>
                <li><a href="profile.html">🛒 سلة المشتريات والحساب</a></li>
                <li><a href="privacy.html">🔒 سياسة الخصوصية</a></li>
                
                <li id="loginMenuLi">
                    <a href="login.html">🔑 تسجيل الدخول</a>
                </li>
                <li id="logoutMenuLi" style="display: none;">
                    <button onclick="logoutUser()" class="btn-logout-sidebar">🚪 تسجيل الخروج</button>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 20px; font-size: 1.8rem;">كتالوج المنتجات الرقمية 📦</h1>

            <!-- شريط البحث السريع -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن كتاب، مجسم 3D، أو دورة تعليمية..." oninput="handleFilterAndSearch()">
            </div>

            <!-- شريط تصنيف المنتجات -->
            <div class="filter-container">
                <button class="filter-btn active" data-cat="all" onclick="filterCategory('all', event)">الكل</button>
                <button class="filter-btn" data-cat="books" onclick="filterCategory('books', event)">📚 كتب وروايات</button>
                <button class="filter-btn" data-cat="models" onclick="filterCategory('models', event)">🎨 مجسمات 3D/2D</button>
                <button class="filter-btn" data-cat="courses" onclick="filterCategory('courses', event)">🎓 دورات فيديو</button>
                <button class="filter-btn" data-cat="gaming" onclick="filterCategory('gaming', event)">🎮 ألعاب واشتراكات</button>
            </div>

            <!-- شبكة عرض المنتجات -->
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>

    <!-- نافذة التفاصيل (Modal) -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <span class="product-badge" id="modalBadge"></span>
            <h2 id="modalTitle" style="margin-bottom: 10px;"></h2>
            <p id="modalDesc" style="color: var(--text-sub); margin-bottom: 20px; font-size:0.95rem;"></p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="modalPrice" class="product-price"></span>
                <button id="modalAddBtn" class="btn-add">إضافة للسلة 🛒</button>
            </div>
        </div>
    </div>

    <!-- عنصر التنبيه السريع عند الإضافة -->
    <div id="toast" class="toast-notification"></div>

    <script>
        let currentCategory = 'all';

        const products = [
            { id: 1, title: "كتاب أساسيات البرمجة بلغة Python", cat: "books", badge: "كتاب PDF", desc: "دليل شامل للمبتدئين لتعلم البرمجة وتطوير السكربتات من الصفر.", price: "9.99 $", fileUrl: "https://example.com/files/python.pdf" },
            { id: 2, title: "رواية ظلال الخزنة الرقمية", cat: "books", badge: "رواية إلكترونية", desc: "رواية خيال علمي وتشويق تقني مشوقة جدًا.", price: "4.99 $", fileUrl: "https://example.com/files/novel.pdf" },
            { id: 3, title: "حزمة مجسمات 3D أسلحة عالية الدقة", cat: "models", badge: "ملفات Blender/FBX", desc: "أصول 3D جاهزة للاستخدام في محركات الألعاب مثل Godot وUnity.", price: "19.99 $", fileUrl: "https://example.com/files/3d_weapons.zip" },
            { id: 4, title: "مجموعة أيقونات وواجهات 2D Cyberpunk", cat: "models", badge: "تصاميم PNG/SVG", desc: "تصاميم وأيقونات احترافية لتطوير الألعاب والواجهات.", price: "7.50 $", fileUrl: "https://example.com/files/ui_pack.zip" },
            { id: 5, title: "دورة تطوير الألعاب عبر Godot Engine", cat: "courses", badge: "سلسلة فيديوهات", desc: "شرح كامل لبناء لعبة FPS ثلاثية الأبعاد خطوة بخطوة.", price: "29.99 $", fileUrl: "https://example.com/files/godot_course.txt" },
            { id: 6, title: "دورة الأمن السيبراني واختبار الاختراق", cat: "courses", badge: "دورة تعليمية", desc: "تعلم أساسيات الحماية والمختبرات الافتراضية Kali Linux.", price: "34.99 $", fileUrl: "https://example.com/files/cyber_course.txt" },
            { id: 7, title: "بطاقة شحن رقمية 500 eFootball Coins", cat: "gaming", badge: "كود فوري", desc: "كود شحن فوري وآمن لحسابك.", price: "5.00 $", fileUrl: "https://example.com/files/code_500.txt" },
            { id: 8, title: "اشتراك شحن العاب وتفعيل سيرفرات", cat: "gaming", badge: "بطاقة رقمية", desc: "بطاقة تفعيل اشتراكات وخدمات رقمية متنوعة.", price: "12.00 $", fileUrl: "https://example.com/files/sub_card.txt" }
        ];

        function renderProducts(items) {
            const grid = document.getElementById("productsGrid");
            if (items.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-sub); grid-column: 1/-1; text-align:center; padding: 40px;">لا توجد منتجات مطابقة لعملية البحث.</p>`;
                return;
            }
            grid.innerHTML = items.map(p => `
                <div class="product-card" onclick="openModal(${p.id})">
                    <div>
                        <span class="product-badge">${p.badge}</span>
                        <h3 class="product-title">${p.title}</h3>
                        <p class="product-desc">${p.desc}</p>
                    </div>
                    <div class="product-footer">
                        <span class="product-price">${p.price}</span>
                        <button class="btn-add" onclick="event.stopPropagation(); addToCart('${p.title}', '${p.price}', '${p.fileUrl}')">إضافة للسلة 🛒</button>
                    </div>
                </div>
            `).join('');
        }

        function handleFilterAndSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            
            const filtered = products.filter(p => {
                const matchesCat = (currentCategory === 'all' || p.cat === currentCategory);
                const matchesSearch = p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            renderProducts(filtered);
        }

        function filterCategory(cat, evt) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            if (evt && evt.target) {
                evt.target.classList.add('active');
            } else {
                const targetBtn = document.querySelector(`.filter-btn[data-cat="${cat}"]`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            handleFilterAndSearch();
        }

        function openModal(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;

            document.getElementById("modalBadge").textContent = item.badge;
            document.getElementById("modalTitle").textContent = item.title;
            document.getElementById("modalDesc").textContent = item.desc;
            document.getElementById("modalPrice").textContent = item.price;
            
            const modalAddBtn = document.getElementById("modalAddBtn");
            modalAddBtn.onclick = () => {
                addToCart(item.title, item.price, item.fileUrl);
                closeModal();
            };

            document.getElementById("productModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("productModal").style.display = "none";
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.display = "none";
            }, 2500);
        }

        function addToCart(name, price, fileUrl) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push({ name, price, fileUrl });
            localStorage.setItem("cart", JSON.stringify(cart));
            showToast(`تمت إضافة "${name}" إلى السلة 🛒`);
        }

        function checkAuthStatus() {
            const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
            const loginLi = document.getElementById("loginMenuLi");
            const logoutLi = document.getElementById("logoutMenuLi");

            if (isLoggedIn) {
                if (loginLi) loginLi.style.display = "none";
                if (logoutLi) logoutLi.style.display = "block";
            } else {
                if (loginLi) loginLi.style.display = "block";
                if (logoutLi) logoutLi.style.display = "none";
            }
        }

        function logoutUser() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userProfile");
            sessionStorage.clear();

            alert("تم تسجيل الخروج بنجاح!");
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkAuthStatus();

            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get('cat');
            if (categoryParam) {
                filterCategory(categoryParam);
            } else {
                renderProducts(products);
            }
        });
    </script>
</body>
</html>
