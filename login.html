<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Google Identity Services الرسمية -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-card {
            background-color: var(--card-bg, #1a1a2e);
            border: 1px solid var(--border-color, #2a2a4a);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .auth-header p {
            color: #a0a0c0;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">الخزنة<span>الرقمية</span></a></div>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>مرحباً بك 👋</h2>
                <p>سجل دخولك بنقرة واحدة باستخدام حساب Google الخاص بك</p>
            </div>

            <!-- زر Google المباشر والرسمي -->
            <div class="google-btn-wrapper">
                <div id="g_id_onload"
                     data-client_id="870188384624-qehhips6amad0s5k5hhb543ng32hbpq5.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <script>
        // دالة فك شفرة JWT الخاصة بجوجل للحصول على الصورة والاسم
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // الاستجابة عند نجاح التسجيل بـ Google
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            // حفظ بيانات المستخدم في المتصفح
            const userData = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture,
                isLoggedIn: true
            };
            
            localStorage.setItem("userProfile", JSON.stringify(userData));
            alert("تم تسجيل الدخول بنجاح! مرحباً بك " + responsePayload.name);
            window.location.href = "profile.html";
        }
    </script>
</body>
</html>
