<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 20px;
            transition: opacity 0.3s;
        }
        .google-btn:hover {
            opacity: 0.9;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
            z-index: 1;
        }
        .divider span {
            background: var(--card-bg);
            padding: 0 15px;
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
            z-index: 2;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">الخزنة<span>الرقمية</span></a></div>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="index.html#products">المنتجات</a>
        </nav>
    </header>

    <!-- بطاقة تسجيل الدخول -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>مرحباً بك مجدداً 👋</h2>
                <p>سجل دخولك للوصول إلى حسابك ومشترياتك الرقمية</p>
            </div>

            <!-- زر الدخول بجوجل التفاعلي -->
            <button class="google-btn" id="btnGoogleLogin" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                متابعة باستخدام Google
            </button>

            <div class="divider">
                <span>أو عبر البريد الإلكتروني</span>
            </div>

            <!-- نموذج الدخول -->
            <form id="loginForm" onsubmit="handleEmailLogin(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary full-width">تسجيل الدخول</button>
            </form>

            <div class="auth-footer">
                ليس لديك حساب؟ <a href="signup.html">أنشئ حساباً جديداً</a>
            </div>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <footer>
        <p>جميع الحقوق محفوظة © 2026 — <strong>الخزنة الرقمية</strong></p>
    </footer>

    <script>
        // محاكاة تسجيل الدخول السريع عبر Google
        function handleGoogleLogin() {
            const userEmail = prompt("أدخل بريدك في Google للدخول المباشر:");
            if (userEmail) {
                localStorage.setItem("userLoggedIn", "true");
                localStorage.setItem("userEmail", userEmail);
                alert("تم تسجيل الدخول بنجاح بحساب Google!");
                window.location.href = "index.html";
            }
        }

        // تسجيل الدخول العادي بالبريد
        function handleEmailLogin(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            localStorage.setItem("userLoggedIn", "true");
            localStorage.setItem("userEmail", email);
            alert("تم تسجيل الدخول بنجاح!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
