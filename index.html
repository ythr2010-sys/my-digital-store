<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الرقمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="logo">المتجر الرقمي</div>
        <nav>
            <a href="#products">المنتجات</a>
            <a href="#features">المميزات</a>
        </nav>
    </header>

    <!-- الواجهة الرئيسية -->
    <section class="hero">
        <h1>كنوزك الرقمية بضغطة زر</h1>
        <p>احصل على أفضل القوالب والملفات الجاهزة للتحميل الفوري</p>
        <a href="#products" class="btn">تصفح المنتجات</a>
    </section>

    <!-- شبكة المنتجات -->
    <section id="products" class="products-grid">
        <div class="product-card">
            <h3>حزمة قوالب تصاميم</h3>
            <p>قوالب جاهزة للتعديل والاستخدام المباشر</p>
            <span class="price">$5.00</span>
            <!-- ضع رابط منتجك من Payhip هنا -->
            <a href="رابط_المنتج_من_payhip" class="buy-btn">شراء الآن</a>
        </div>
    </section>

    <!-- المميزات -->
    <section id="features" class="features">
        <div>⚡ تحميل فوري وآلي</div>
        <div>🛡️ جودة عالية</div>
        <div>💳 دفع آمن</div>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة © 2026</p>
    </footer>

</body>
</html>
