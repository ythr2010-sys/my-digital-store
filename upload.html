<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال منتج جديد | الخزنة الرقمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); padding: 30px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-line); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 20px; font-size: 1.5rem; color: var(--accent-cyan); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 12px 14px; background: #0e0e1a; border: 1px solid var(--border-line); border-radius: 8px; color: #fff; font-family: inherit; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan); outline: none; }
        textarea { height: 100px; resize: vertical; }
        .hint { font-size: 0.8rem; color: var(--text-sub); margin-top: 5px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-sub); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-cyan); }
        #statusMsg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="shop.html" class="back-link">← العودة إلى المتجر</a>
        <h1>إرسال منتج رقمي جديد 📦</h1>
        <form id="uploadForm">
            <div class="form-group">
                <label>عنوان المنتج</label>
                <input type="text" id="pTitle" required placeholder="مثال: دورة احتراف بايثون كاملة">
            </div>

            <div class="form-group">
                <label>التصنيف</label>
                <select id="pCat">
                    <option value="books">📚 كتب وروايات</option>
                    <option value="models">🎨 مجسمات 3D/2D</option>
                    <option value="courses">🎓 دورات فيديو</option>
                    <option value="gaming">🎮 ألعاب واشتراكات</option>
                </select>
            </div>

            <div class="form-group">
                <label>الشارة (Badge)</label>
                <input type="text" id="pBadge" placeholder="مثال: ملف ضخم | PDF | Blender" value="منتج رقمي">
            </div>

            <div class="form-group">
                <label>السعر (بالدولار أو مجاني)</label>
                <input type="text" id="pPrice" value="مجاني" placeholder="مجاني أو 5">
            </div>

            <div class="form-group">
                <label>رابط صورة الغلاف (Image URL)</label>
                <input type="url" id="pImgUrl" placeholder="https://example.com/image.jpg">
                <div class="hint">ضع رابط صورة مباشرة أو اتركه فارغاً ليأخذ صورة افتراضية.</div>
            </div>

            <div class="form-group">
                <label>رابط الملف الكبير (Google Drive / Mega / MediaFire)</label>
                <input type="url" id="pDownloadUrl" required placeholder="https://drive.google.com/...">
                <div class="hint">للملفات الكبيرة (دورات، مجسمات ثقيلة)، ارفعها على درايف وضع الرابط هنا. التسليم يكون تلقائياً بعد الشراء.</div>
            </div>

            <div class="form-group">
                <label>وصف المنتج</label>
                <textarea id="pDesc" required placeholder="اشرح باختصار ما يحصل عليه المشترِ..."></textarea>
            </div>

            <button type="button" class="btn-submit" id="submitBtn" onclick="submitProduct()">إرسال للمراجعة / النشر 🚀</button>
            <div id="statusMsg"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClXL28rqPQr--pUu3N_Y-X3ihXEAKOyg8",
            authDomain: "digivault-4c3a3.firebaseapp.com",
            projectId: "digivault-4c3a3",
            storageBucket: "digivault-4c3a3.firebasestorage.app",
            messagingSenderId: "578335534171",
            appId: "1:578335534171:web:1b108a849c0543f998a37e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitProduct = async function() {
            const btn = document.getElementById("submitBtn");
            const statusMsg = document.getElementById("statusMsg");
            
            const title = document.getElementById("pTitle").value.trim();
            const cat = document.getElementById("pCat").value;
            const badge = document.getElementById("pBadge").value.trim();
            const price = document.getElementById("pPrice").value.trim();
            const imageUrl = document.getElementById("pImgUrl").value.trim() || "https://via.placeholder.com/300x160?text=DigiVault";
            const downloadUrl = document.getElementById("pDownloadUrl").value.trim();
            const description = document.getElementById("pDesc").value.trim();

            if (!title || !downloadUrl || !description) {
                statusMsg.style.color = "var(--danger-red)";
                statusMsg.textContent = "الرجاء ملء الحقول الإجبارية (العنوان، الرابط، الوصف).";
                return;
            }

            btn.disabled = true;
            btn.textContent = "جاري الحفظ في القاعدة...";
            statusMsg.textContent = "";

            try {
                await addDoc(collection(db, "products"), {
                    title,
                    cat,
                    badge,
                    price,
                    imageUrl,
                    downloadUrl,
                    description,
                    status: "approved", // اعْتُمِد مباشرة ليظهر فوراً في المتجر، أو اجعلها "pending" لو تريد مراجعة الأدمن
                    createdAt: serverTimestamp()
                });

                statusMsg.style.color = "var(--success)";
                statusMsg.textContent = "تم إرسال وحفظ المنتج بنجاح! سيظهر في المتجر.";
                document.getElementById("uploadForm").reset();
            } catch (err) {
                console.error(err);
                statusMsg.style.color = "var(--danger-red)";
                statusMsg.textContent = "حدث خطأ أثناء الاتصال بقاعدة البيانات.";
            } finally {
                btn.disabled = false;
                btn.textContent = "إرسال للمراجعة / النشر 🚀";
            }
        };
    </script>
</body>
</html>
