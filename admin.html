<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
            --success-green: #2ed573;
            --warning-yellow: #ffa502;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .access-denied {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            margin: 100px auto;
            text-align: center;
        }

        .admin-panel {
            display: none;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-line);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label { font-size: 0.85rem; color: var(--text-sub); }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 14px;
            background: #1e1e24;
            border: 1px solid var(--border-line);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            width: 100%;
        }

        .btn-submit:hover { opacity: 0.9; }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .products-table th, .products-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-line);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .products-table th {
            color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-action {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            border: none;
            margin-left: 4px;
        }

        .btn-edit {
            background: rgba(255, 165, 2, 0.2);
            color: var(--warning-yellow);
            border: 1px solid var(--warning-yellow);
        }

        .btn-edit:hover {
            background: var(--warning-yellow);
            color: #000;
        }

        .btn-delete {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #fff;
        }

        .prod-img-preview {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            background: #1e1e24;
        }
    </style>
</head>
<body>

    <!-- بوابة التحقق -->
    <div class="access-denied" id="accessGate">
        <h2 id="gateTitle" style="color: var(--accent-cyan);">⏳ جاري التحقق من الصلاحيات...</h2>
        <p id="gateMessage" style="color: var(--text-sub); margin-top: 10px;"></p>
        
        <!-- صندوق إدخال الرمز السري الإضافي (الأمان المضاعف) -->
        <div id="pinBox" style="display: none; margin-top: 20px;">
            <input type="password" id="secretPinInput" placeholder="أدخل الرمز السري للوحة التحكم" style="width: 100%; padding: 10px; background: #1e1e24; border: 1px solid var(--border-line); border-radius: 8px; color: #fff; text-align: center; margin-bottom: 10px; outline: none;">
            <button id="verifyPinBtn" class="btn-submit">دخول لوحة التحكم 🔓</button>
        </div>

        <a href="shop.html" id="gateBtn" style="display:none; margin-top:20px; color: var(--accent-cyan); text-decoration: none; font-weight: bold; display:inline-block;">← العودة للمتجر</a>
    </div>

    <!-- لوحة التحكم الأساسية -->
    <div class="admin-container admin-panel" id="adminPanel">
        <div class="header-admin">
            <div>
                <h1>👑 لوحة إدارة الخزنة الرقمية</h1>
                <span id="userRoleBadge" style="background: rgba(0,210,255,0.2); color: var(--accent-cyan); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;"></span>
            </div>
            <a href="shop.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: bold;">← العودة للمتجر</a>
        </div>

        <!-- قسم إدارة المشرفين المساعدين -->
        <div class="card" id="superAdminSection" style="display: none; border-color: var(--accent-purple);">
            <h3 style="margin-bottom: 15px; color: #c084fc;">🛡️ إدارة المشرفين المساعدين (صلاحية المدير الرئيسي فقط)</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="email" id="helperEmailInput" placeholder="أدخل البريد الإلكتروني للمساعد الجديد" style="flex:1; padding: 10px; background:#1e1e24; border:1px solid var(--border-line); border-radius:8px; color:#fff;">
                <button id="addHelperBtn" class="btn-submit" style="width: auto;">إضافة كمساعد ➕</button>
            </div>
            <h4>قائمة المساعدين الحاليين:</h4>
            <ul id="helpersList" style="list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px;"></ul>
        </div>

        <!-- قسم إضافة / تعديل المنتج -->
        <div class="card">
            <h3 id="formTitle" style="margin-bottom: 20px; color: var(--accent-cyan);">➕ إضافة منتج رقمي جديد</h3>
            <form id="addProductForm">
                <input type="hidden" id="editProductId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>عنوان المنتج:</label>
                        <input type="text" id="pTitle" placeholder="مثال: كتاب أساسيات Python" required>
                    </div>
                    <div class="form-group">
                        <label>الفئة (Category):</label>
                        <select id="pCat">
                            <option value="books">📚 كتب وروايات</option>
                            <option value="models">🎨 مجسمات 3D/2D</option>
                            <option value="courses">🎓 دورات فيديو</option>
                            <option value="gaming">🎮 ألعاب وااشتراكات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>شارة المنتج (Badge):</label>
                        <input type="text" id="pBadge" placeholder="مثال: كتاب PDF أو ملف FBX" required>
                    </div>
                    <div class="form-group">
                        <label>السعر ($):</label>
                        <input type="text" id="pPrice" placeholder="مثال: 9.99 $" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>رابط صورة المنتج (Thumbnail Image):</label>
                        <input type="url" id="pImgUrl" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>رابط تنزيل الملف المباشر (Google Drive / Mega):</label>
                        <input type="url" id="pFileUrl" placeholder="https://..." required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>وصف المنتج:</label>
                    <textarea id="pDesc" rows="3" placeholder="اكتب وصفاً قصيراً ومفهوماً للمنتج..." required></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-submit" id="submitBtn">حفظ وإضافة للمتجر 💾</button>
                    <button type="button" class="btn-action" id="cancelEditBtn" style="display:none; background: #333; color: #fff;">إلغاء التعديل ❌</button>
                </div>
            </form>
        </div>

        <!-- جدول المنتجات المسجلة -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">📋 المنتجات المسجلة حالياً</h3>
            <div style="overflow-x: auto;">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>المنتج</th>
                            <th>الفئة</th>
                            <th>السعر</th>
                            <th>رابط التحميل</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            doc, 
            updateDoc, 
            deleteDoc, 
            setDoc,
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const SUPER_ADMIN_UID = "kkfUSkke8ZfKpiXFrVfpbCjfYdx1"; 
        const SECRET_PANEL_PIN = "2026"; // 🔑 ضع هنا الرمز السري الخاص بك (يمكنك تغيير الرقم كما تريد)

        let customProducts = [];
        let helperAdmins = [];

        async function fetchProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                customProducts = [];
                querySnapshot.forEach((docSnap) => {
                    customProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAdminTable();
            } catch (error) {
                console.error("خطأ في جلب المنتجات:", error);
            }
        }

        async function fetchHelpers() {
            try {
                const querySnapshot = await getDocs(collection(db, "helpers"));
                helperAdmins = [];
                querySnapshot.forEach((docSnap) => {
                    helperAdmins.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderHelpersList();
            } catch (error) {
                console.error("خطأ في جلب المساعدين:", error);
            }
        }

        window.renderAdminTable = function() {
            const tbody = document.getElementById("adminProductsTable");
            if (customProducts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-sub);">لا توجد منتجات حالياً. قم بإضافة منتج جديد.</td></tr>`;
                return;
            }
            tbody.innerHTML = customProducts.map((p) => `
                <tr>
                    <td><img src="${p.imgUrl || 'https://via.placeholder.com/40'}" class="prod-img-preview" alt="product"></td>
                    <td><strong>${p.title}</strong></td>
                    <td>${p.cat}</td>
                    <td style="color:var(--accent-cyan); font-weight:bold;">${p.price}</td>
                    <td><a href="${p.fileUrl}" target="_blank" style="color:var(--text-sub);">معاينة 🔗</a></td>
                    <td>
                        <button class="btn-action btn-edit" onclick="window.editProduct('${p.id}')">تعديل ✏️</button>
                        <button class="btn-action btn-delete" onclick="window.deleteProduct('${p.id}')">حذف 🗑️</button>
                    </td>
                </tr>
            `).join('');
        };

        window.editProduct = function(docId) {
            const p = customProducts.find(item => item.id === docId);
            if (!p) return;

            document.getElementById("editProductId").value = p.id;
            document.getElementById("pTitle").value = p.title;
            document.getElementById("pCat").value = p.cat;
            document.getElementById("pBadge").value = p.badge;
            document.getElementById("pPrice").value = p.price;
            document.getElementById("pImgUrl").value = p.imgUrl || "";
            document.getElementById("pFileUrl").value = p.fileUrl;
            document.getElementById("pDesc").value = p.desc;

            document.getElementById("formTitle").textContent = "✏️ تعديل المنتج";
            document.getElementById("submitBtn").textContent = "تحديث المنتج 🔄";
            document.getElementById("cancelEditBtn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            document.getElementById("addProductForm").reset();
            document.getElementById("editProductId").value = "";
            document.getElementById("formTitle").textContent = "➕ إضافة منتج رقمي جديد";
            document.getElementById("submitBtn").textContent = "حفظ وإضافة للمتجر 💾";
            document.getElementById("cancelEditBtn").style.display = "none";
        };

        window.deleteProduct = async function(docId) {
            if (confirm("هل أنت متأكد من رغبتك في حذف هذا المنتج نهائياً من المتجر؟")) {
                try {
                    await deleteDoc(doc(db, "products", docId));
                    await fetchProducts();
                    alert("تم حذف المنتج بنجاح! 🗑️");
                } catch (error) {
                    alert("حدث خطأ أثناء الحذف: " + error.message);
                }
            }
        };

        window.addHelperAdmin = async function() {
            const emailInput = document.getElementById("helperEmailInput");
            const email = emailInput.value.trim().toLowerCase();
            if (email) {
                try {
                    await setDoc(doc(db, "helpers", email), { email: email, createdAt: new Date() });
                    emailInput.value = "";
                    await fetchHelpers();
                    alert(`تمت إضافة ${email} كمشرف مساعد بنجاح!`);
                } catch (error) {
                    alert("حدث خطأ أثناء إضافة المشرف: " + error.message);
                }
            }
        };

        window.removeHelperAdmin = async function(docId) {
            if (confirm(`هل أنت متأكد من تجريد هذا الحساب من صلاحيات الإشراف؟`)) {
                try {
                    await deleteDoc(doc(db, "helpers", docId));
                    await fetchHelpers();
                    alert("تم سحب الصلاحيات بنجاح!");
                } catch (error) {
                    alert("حدث خطأ أثناء العزل: " + error.message);
                }
            }
        };

        function helpersListMarkup() {
            const list = document.getElementById("helpersList");
            if (helperAdmins.length === 0) {
                list.innerHTML = `<li style="color:var(--text-sub); font-size:0.85rem;">لا يوجد مشرفون مساعدون حالياً.</li>`;
                return;
            }
            list.innerHTML = helperAdmins.map(helper => `
                <li style="display:flex; justify-content:space-between; align-items:center; background:#1e1e24; padding:8px 12px; border-radius:6px;">
                    <span>📧 ${helper.email}</span>
                    <button onclick="window.removeHelperAdmin('${helper.id}')" class="btn-action btn-delete">عزل / حذف ❌</button>
                </li>
            `).join('');
        }
        
        window.renderHelpersList = helpersListMarkup;

        document.getElementById("addProductForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const editId = document.getElementById("editProductId").value;

            const productData = {
                title: document.getElementById("pTitle").value,
                cat: document.getElementById("pCat").value,
                badge: document.getElementById("pBadge").value,
                price: document.getElementById("pPrice").value,
                imgUrl: document.getElementById("pImgUrl").value,
                fileUrl: document.getElementById("pFileUrl").value,
                desc: document.getElementById("pDesc").value,
                updatedAt: new Date()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "products", editId), productData);
                    alert("تم تحديث المنتج بنجاح! ✏️");
                } else {
                    productData.createdAt = new Date();
                    await addDoc(collection(db, "products"), productData);
                    alert("تمت إضافة المنتج للسيرفر بنجاح! ➕");
                }

                window.resetForm();
                await fetchProducts();
            } catch (error) {
                alert("حدث خطأ أثناء الحفظ: " + error.message);
            }
        });

        document.getElementById("cancelEditBtn").addEventListener("click", window.resetForm);
        document.getElementById("addHelperBtn").addEventListener("click", window.addHelperAdmin);

        // التحقق من صلاحيات المستخدم عند فتح الصفحة
        onAuthStateChanged(auth, async (user) => {
            const accessGate = document.getElementById("accessGate");
            const adminPanel = document.getElementById("adminPanel");
            const gateTitle = document.getElementById("gateTitle");
            const gateMessage = document.getElementById("gateMessage");
            const gateBtn = document.getElementById("gateBtn");
            const pinBox = document.getElementById("pinBox");

            if (user) {
                const userEmail = user.email ? user.email.toLowerCase() : "";
                const isSuperAdmin = (user.uid === SUPER_ADMIN_UID);

                let isHelper = false;
                if (userEmail) {
                    try {
                        const helperDoc = await getDoc(doc(db, "helpers", userEmail));
                        isHelper = helperDoc.exists();
                    } catch (e) {
                        console.error("خطأ أثناء التحقق من صلاحية المساعد:", e);
                    }
                }

                if (isSuperAdmin || isHelper) {
                    // التحقق من الرمز السري الإضافي (PIN)
                    gateTitle.textContent = "🔒 أدخل الرمز السري للوحة التحكم";
                    gateTitle.style.color = "var(--accent-cyan)";
                    gateMessage.textContent = `مرحباً بك (${userEmail || "المدير"}). يرجى إدخال الرمز السري الخاص بالصفحة للمتابعة.`;
                    pinBox.style.display = "block";

                    // زر التحقق من الرمز
                    document.getElementById("verifyPinBtn").onclick = async function() {
                        const enteredPin = document.getElementById("secretPinInput").value.trim();
                        if (enteredPin === SECRET_PANEL_PIN) {
                            accessGate.style.display = "none";
                            adminPanel.style.display = "block";

                            await fetchProducts();

                            if (isSuperAdmin) {
                                document.getElementById("userRoleBadge").textContent = "المدير الرئيسي (Super Admin)";
                                document.getElementById("superAdminSection").style.display = "block";
                                await fetchHelpers();
                            } else {
                                document.getElementById("userRoleBadge").textContent = "مشرف مساعد (Helper Admin)";
                                document.getElementById("superAdminSection").style.display = "none";
                            }
                        } else {
                            alert("❌ الرمز السري غير صحيح! حاول مرة أخرى.");
                        }
                    };

                } else {
                    gateTitle.textContent = "❌ عذراً، لا تملك صلاحية الدخول";
                    gateTitle.style.color = "var(--danger-red)";
                    gateMessage.textContent = `حسابك الحالي (${userEmail || user.uid}) غير مصرح له بإدارة الموقع.`;
                    pinBox.style.display = "none";
                    gateBtn.style.display = "inline-block";
                }
            } else {
                gateTitle.textContent = "🔒 يجب تسجيل الدخول أولاً";
                gateMessage.textContent = "قم بتسجيل الدخول بحساب المدير للوصول للوحة التحكم.";
                pinBox.style.display = "none";
                gateBtn.style.display = "inline-block";
            }
        });
    </script>
</body>
</html>
