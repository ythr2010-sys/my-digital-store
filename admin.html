<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
            --success-green: #2ed573;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* نافذة حماية لوحة التحكم */
        .login-gate {
            background: var(--bg-card);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            margin: 100px auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.15);
        }

        .login-gate input {
            width: 100%;
            padding: 12px 16px;
            margin: 20px 0;
            background: #1e1e24;
            border: 1px solid var(--border-line);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .admin-panel {
            display: none; /* تظهر فقط بعد إدخال كود الأدمن Correctly */
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-line);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 14px;
            background: #1e1e24;
            border: 1px solid var(--border-line);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            width: 100%;
        }

        .btn-submit:hover { opacity: 0.9; }

        /* جدول المنتجات */
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .products-table th, .products-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-line);
            font-size: 0.9rem;
        }

        .products-table th {
            color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-delete {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- بوابة التحقق لكلمة مرور الأدمن -->
    <div class="login-gate" id="loginGate">
        <h2>🔒 لوحة تحكم المدير</h2>
        <p style="color: var(--text-sub); font-size: 0.9rem; margin-top: 8px;">أدخل كلمة المرور للوصول إلى خيارات الإدارة</p>
        <input type="password" id="adminPassInput" placeholder="أدخل رمز المرور">
        <button class="btn-submit" onclick="verifyAdmin()">دخول اللوحة 🚀</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div class="admin-container admin-panel" id="adminPanel">
        <div class="header-admin">
            <h1>👑 لوحة إدارة الخزنة الرقمية</h1>
            <a href="shop.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: bold;">← العودة للمتجر</a>
        </div>

        <!-- بطاقة إضافة منتج جديد -->
        <div class="card">
            <h3 style="margin-bottom: 20px; color: var(--accent-cyan);">➕ إضافة منتج رقمي جديد</h3>
            <form id="addProductForm" onsubmit="handleAddProduct(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>عنوان المنتج:</label>
                        <input type="text" id="pTitle" placeholder="مثال: كتاب أساسيات Python" required>
                    </div>
                    <div class="form-group">
                        <label>الفئة (Category):</label>
                        <select id="pCat">
                            <option value="books">📚 كتب وروايات</option>
                            <option value="models">🎨 مجسمات 3D/2D</option>
                            <option value="courses">🎓 دورات فيديو</option>
                            <option value="gaming">🎮 ألعاب وااشتراكات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>شارة المنتج (Badge):</label>
                        <input type="text" id="pBadge" placeholder="مثال: كتاب PDF أو ملف FBX" required>
                    </div>
                    <div class="form-group">
                        <label>السعر ($):</label>
                        <input type="text" id="pPrice" placeholder="مثال: 9.99 $" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>رابط تنزيل الملف المباشر (Google Drive / Mega):</label>
                    <input type="url" id="pFileUrl" placeholder="https://..." required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>وصف المنتج:</label>
                    <textarea id="pDesc" rows="3" placeholder="اكتب وصفاً قصيراً ومفهوماً للمنتج..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">حفظ وإضافة للمتجر 💾</button>
            </form>
        </div>

        <!-- قائمة المنتجات الحالية -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">📋 المنتجات المسجلة حالياً</h3>
            <div style="overflow-x: auto;">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>المنتج</th>
                            <th>الفئة</th>
                            <th>السعر</th>
                            <th>رابط التحميل</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable">
                        <!-- تُحمل المنتجات هنا عبر JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // كلمة مرور الأدمن الافتراضية (يمكنك تغييرها إلى أي رمز تحبه)
        const ADMIN_PASS = "admin123";

        // الروابط والمنتجات الافتراضية
        let customProducts = JSON.parse(localStorage.getItem("customProducts")) || [
            { id: 1, title: "كتاب أساسيات البرمجة بلغة Python", cat: "books", badge: "كتاب PDF", desc: "دليل شامل للمبتدئين.", price: "9.99 $", fileUrl: "https://example.com/files/python.pdf" },
            { id: 2, title: "حزمة مجسمات 3D أسلحة", cat: "models", badge: "ملفات FBX", desc: "أصول 3D جاهزة.", price: "19.99 $", fileUrl: "https://example.com/files/weapons.zip" }
        ];

        function verifyAdmin() {
            const input = document.getElementById("adminPassInput").value;
            if (input === ADMIN_PASS) {
                document.getElementById("loginGate").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                renderAdminTable();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function renderAdminTable() {
            const tbody = document.getElementById("adminProductsTable");
            tbody.innerHTML = customProducts.map((p, index) => `
                <tr>
                    <td><strong>${p.title}</strong></td>
                    <td>${p.cat}</td>
                    <td style="color:var(--accent-cyan); font-weight:bold;">${p.price}</td>
                    <td><a href="${p.fileUrl}" target="_blank" style="color:var(--text-sub);">معاينة الرابط 🔗</a></td>
                    <td><button class="btn-delete" onclick="deleteProduct(${index})">حذف 🗑️</button></td>
                </tr>
            `).join('');
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const newProduct = {
                id: Date.now(),
                title: document.getElementById("pTitle").value,
                cat: document.getElementById("pCat").value,
                badge: document.getElementById("pBadge").value,
                price: document.getElementById("pPrice").value,
                fileUrl: document.getElementById("pFileUrl").value,
                desc: document.getElementById("pDesc").value
            };

            customProducts.push(newProduct);
            localStorage.setItem("customProducts", JSON.stringify(customProducts));
            renderAdminTable();
            document.getElementById("addProductForm").reset();
            alert("تم إضافة المنتج بنجاح إلى المتجر!");
        }

        function deleteProduct(index) {
            if (confirm("هل أنت تأكد من رغبتك في حذف هذا المنتج؟")) {
                customProducts.splice(index, 1);
                localStorage.setItem("customProducts", JSON.stringify(customProducts));
                renderAdminTable();
            }
        }
    </script>
</body>
</html>
