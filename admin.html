<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
            --success-green: #2ed573;
            --warning-yellow: #ffa502;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .access-denied {
            background: var(--bg-card);
            border: 1px solid var(--danger-red);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            margin: 100px auto;
            text-align: center;
        }

        .admin-panel {
            display: none;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-line);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label { font-size: 0.85rem; color: var(--text-sub); }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 14px;
            background: #1e1e24;
            border: 1px solid var(--border-line);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            width: 100%;
        }

        .btn-submit:hover { opacity: 0.9; }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .products-table th, .products-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-line);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .products-table th {
            color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-action {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            border: none;
            margin-left: 4px;
        }

        .btn-edit {
            background: rgba(255, 165, 2, 0.2);
            color: var(--warning-yellow);
            border: 1px solid var(--warning-yellow);
        }

        .btn-edit:hover {
            background: var(--warning-yellow);
            color: #000;
        }

        .btn-delete {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #fff;
        }

        .prod-img-preview {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            background: #1e1e24;
        }
    </style>
</head>
<body>

    <div class="access-denied" id="accessGate">
        <h2 id="gateTitle" style="color: var(--accent-cyan);">⏳ جاري التحقق من الصلاحيات...</h2>
        <p id="gateMessage" style="color: var(--text-sub); margin-top: 10px;"></p>
        <a href="shop.html" id="gateBtn" style="display:none; margin-top:20px; color: var(--accent-cyan); text-decoration: none; font-weight: bold;">← العودة للمتجر</a>
    </div>

    <div class="admin-container admin-panel" id="adminPanel">
        <div class="header-admin">
            <div>
                <h1>👑 لوحة إدارة الخزنة الرقمية</h1>
                <span id="userRoleBadge" style="background: rgba(0,210,255,0.2); color: var(--accent-cyan); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;"></span>
            </div>
            <a href="shop.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: bold;">← العودة للمتجر</a>
        </div>

        <!-- قسم إدارة المشرفين المساعدين -->
        <div class="card" id="superAdminSection" style="display: none; border-color: var(--accent-purple);">
            <h3 style="margin-bottom: 15px; color: #c084fc;">🛡️ إدارة المشرفين المساعدين (صلاحية المدير الرئيسي فقط)</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="email" id="helperEmailInput" placeholder="أدخل البريد الإلكتروني للمساعد الجديد" style="flex:1; padding: 10px; background:#1e1e24; border:1px solid var(--border-line); border-radius:8px; color:#fff;">
                <button onclick="addHelperAdmin()" class="btn-submit" style="width: auto;">إضافة كمساعد ➕</button>
            </div>
            <h4>قائمة المساعدين الحاليين:</h4>
            <ul id="helpersList" style="list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px;"></ul>
        </div>

        <!-- قسم إضافة / تعديل المنتج -->
        <div class="card">
            <h3 id="formTitle" style="margin-bottom: 20px; color: var(--accent-cyan);">➕ إضافة منتج رقمي جديد</h3>
            <form id="addProductForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>عنوان المنتج:</label>
                        <input type="text" id="pTitle" placeholder="مثال: كتاب أساسيات Python" required>
                    </div>
                    <div class="form-group">
                        <label>الفئة (Category):</label>
                        <select id="pCat">
                            <option value="books">📚 كتب وروايات</option>
                            <option value="models">🎨 مجسمات 3D/2D</option>
                            <option value="courses">🎓 دورات فيديو</option>
                            <option value="gaming">🎮 ألعاب واشتراكات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>شارة المنتج (Badge):</label>
                        <input type="text" id="pBadge" placeholder="مثال: كتاب PDF أو ملف FBX" required>
                    </div>
                    <div class="form-group">
                        <label>السعر ($):</label>
                        <input type="text" id="pPrice" placeholder="مثال: 9.99 $" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>رابط صورة المنتج (Thumbnail Image):</label>
                        <input type="url" id="pImgUrl" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>رابط تنزيل الملف المباشر (Google Drive / Mega):</label>
                        <input type="url" id="pFileUrl" placeholder="https://..." required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>وصف المنتج:</label>
                    <textarea id="pDesc" rows="3" placeholder="اكتب وصفاً قصيراً ومفهوماً للمنتج..." required></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-submit" id="submitBtn">حفظ وإضافة للمتجر 💾</button>
                    <button type="button" class="btn-action" id="cancelEditBtn" onclick="resetForm()" style="display:none; background: #333; color: #fff;">إلغاء التعديل ❌</button>
                </div>
            </form>
        </div>

        <!-- جدول المنتجات المسجلة -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">📋 المنتجات المسجلة حالياً</h3>
            <div style="overflow-x: auto;">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>المنتج</th>
                            <th>الفئة</th>
                            <th>السعر</th>
                            <th>رابط التحميل</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // قم باستبدال إعدادات Firebase الخاصة بمتجرك هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const SUPER_ADMIN_EMAIL = "ythr2010@gmail.com"; 

        let helperAdmins = JSON.parse(localStorage.getItem("helperAdmins")) || [];

        let customProducts = JSON.parse(localStorage.getItem("customProducts")) || [
            { 
                id: 1, 
                title: "كتاب أساسيات البرمجة بلغة Python", 
                cat: "books", 
                badge: "كتاب PDF", 
                desc: "دليل شامل للمبتدئين.", 
                price: "9.99 $", 
                imgUrl: "https://via.placeholder.com/150",
                fileUrl: "https://example.com/files/python.pdf" 
            }
        ];

        onAuthStateChanged(auth, (user) => {
            const accessGate = document.getElementById("accessGate");
            const adminPanel = document.getElementById("adminPanel");
            const gateTitle = document.getElementById("gateTitle");
            const gateMessage = document.getElementById("gateMessage");
            const gateBtn = document.getElementById("gateBtn");

            if (user) {
                const userEmail = user.email.toLowerCase();
                const isSuperAdmin = (userEmail === SUPER_ADMIN_EMAIL.toLowerCase());
                const isHelper = helperAdmins.includes(userEmail);

                if (isSuperAdmin || isHelper) {
                    accessGate.style.display = "none";
                    adminPanel.style.display = "block";
                    
                    if (isSuperAdmin) {
                        document.getElementById("userRoleBadge").textContent = "المدير الرئيسي (Super Admin)";
                        document.getElementById("superAdminSection").style.display = "block";
                        renderHelpersList();
                    } else {
                        document.getElementById("userRoleBadge").textContent = "مشرف مساعد (Helper Admin)";
                        document.getElementById("superAdminSection").style.display = "none";
                    }

                    renderAdminTable();
                } else {
                    gateTitle.textContent = "❌ عذراً، لا تملك صلاحية الدخول";
                    gateTitle.style.color = "var(--danger-red)";
                    gateMessage.textContent = "هذه الصفحة مخصصة لمدير الموقع والمشرفين المعتمدين فقط.";
                    gateBtn.style.display = "inline-block";
                }
            } else {
                gateTitle.textContent = "🔒 يجب تسجيل الدخول أولاً";
                gateMessage.textContent = "قم بتسجيل الدخول بحساب المدير للوصول للوحة التحكم.";
                gateBtn.style.display = "inline-block";
            }
        });

        window.renderAdminTable = function() {
            const tbody = document.getElementById("adminProductsTable");
            tbody.innerHTML = customProducts.map((p, index) => `
                <tr>
                    <td><img src="${p.imgUrl || 'https://via.placeholder.com/40'}" class="prod-img-preview" alt="product"></td>
                    <td><strong>${p.title}</strong></td>
                    <td>${p.cat}</td>
                    <td style="color:var(--accent-cyan); font-weight:bold;">${p.price}</td>
                    <td><a href="${p.fileUrl}" target="_blank" style="color:var(--text-sub);">معاينة 🔗</a></td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editProduct(${p.id})">تعديل ✏️</button>
                        <button class="btn-action btn-delete" onclick="deleteProduct(${index})">حذف 🗑️</button>
                    </td>
                </tr>
            `).join('');
        };

        window.handleFormSubmit = function(e) {
            e.preventDefault();
            const editId = document.getElementById("editProductId").value;

            const productData = {
                id: editId ? Number(editId) : Date.now(),
                title: document.getElementById("pTitle").value,
                cat: document.getElementById("pCat").value,
                badge: document.getElementById("pBadge").value,
                price: document.getElementById("pPrice").value,
                imgUrl: document.getElementById("pImgUrl").value,
                fileUrl: document.getElementById("pFileUrl").value,
                desc: document.getElementById("pDesc").value
            };

            if (editId) {
                const idx = customProducts.findIndex(p => p.id === Number(editId));
                if (idx !== -1) customProducts[idx] = productData;
                alert("تم تحديث المنتج بنجاح! ✏️");
            } else {
                customProducts.push(productData);
                alert("تمت إضافة المنتج بنجاح! ➕");
            }

            localStorage.setItem("customProducts", JSON.stringify(customProducts));
            window.renderAdminTable();
            resetForm();
        };

        window.editProduct = function(id) {
            const p = customProducts.find(item => item.id === id);
            if (!p) return;

            document.getElementById("editProductId").value = p.id;
            document.getElementById("pTitle").value = p.title;
            document.getElementById("pCat").value = p.cat;
            document.getElementById("pBadge").value = p.badge;
            document.getElementById("pPrice").value = p.price;
            document.getElementById("pImgUrl").value = p.imgUrl || "";
            document.getElementById("pFileUrl").value = p.fileUrl;
            document.getElementById("pDesc").value = p.desc;

            document.getElementById("formTitle").textContent = "✏️ تعديل المنتج";
            document.getElementById("submitBtn").textContent = "تحديث المنتج 🔄";
            document.getElementById("cancelEditBtn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            document.getElementById("addProductForm").reset();
            document.getElementById("editProductId").value = "";
            document.getElementById("formTitle").textContent = "➕ إضافة منتج رقمي جديد";
            document.getElementById("submitBtn").textContent = "حفظ وإضافة للمتجر 💾";
            document.getElementById("cancelEditBtn").style.display = "none";
        };

        window.deleteProduct = function(index) {
            if (confirm("هل أنت متأكد من رغبتك في حذف هذا المنتج؟")) {
                customProducts.splice(index, 1);
                localStorage.setItem("customProducts", JSON.stringify(customProducts));
                window.renderAdminTable();
            }
        };

        window.addHelperAdmin = function() {
            const emailInput = document.getElementById("helperEmailInput");
            const email = emailInput.value.trim().toLowerCase();
            if (email && !helperAdmins.includes(email) && email !== SUPER_ADMIN_EMAIL.toLowerCase()) {
                helperAdmins.push(email);
                localStorage.setItem("helperAdmins", JSON.stringify(helperAdmins));
                emailInput.value = "";
                renderHelpersList();
                alert(`تمت إضافة ${email} كمشرف مساعد بنجاح!`);
            }
        };

        window.removeHelperAdmin = function(email) {
            if (confirm(`هل أنت متأكد من تجريد ${email} من صلاحيات الإشراف؟`)) {
                helperAdmins = helperAdmins.filter(e => e !== email);
                localStorage.setItem("helperAdmins", JSON.stringify(helperAdmins));
                renderHelpersList();
            }
        };

        function renderHelpersList() {
            const list = document.getElementById("helpersList");
            if (helperAdmins.length === 0) {
                list.innerHTML = `<li style="color:var(--text-sub); font-size:0.85rem;">لا يوجد مشرفون مساعدون حالياً.</li>`;
                return;
            }
            list.innerHTML = helperAdmins.map(email => `
                <li style="display:flex; justify-style:space-between; align-items:center; background:#1e1e24; padding:8px 12px; border-radius:6px;">
                    <span>📧 ${email}</span>
                    <button onclick="removeHelperAdmin('${email}')" class="btn-action btn-delete">عزل / حذف ❌</button>
                </li>
            `).join('');
        }
    </script>
</body>
</html>
