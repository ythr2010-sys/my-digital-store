name = "digivault-upload-worker"
main = "worker.js"
compatibility_date = "2026-09-26"

[[r2_buckets]]
binding = "DIGIVAULT_BUCKET"
bucket_name = "REPLACE_WITH_YOUR_R2_BUCKET"

[vars]
FIREBASE_PROJECT_ID = "digivault-4c3a3"
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET_NAME = "REPLACE_WITH_YOUR_R2_BUCKET"
R2_PARENT_ACCESS_KEY_ID = "REPLACE_WITH_R2_PARENT_ACCESS_KEY_ID"
R2_PUBLIC_BASE_URL = "https://REPLACE_WITH_YOUR_R2_PUBLIC_DOMAIN"
ALLOWED_ORIGINS = "https://ythr2010-sys.github.io"
