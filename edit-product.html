<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل المنتج | الخزنة الرقمية"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#0a0a12;color:#fff;font-family:Tajawal,sans-serif}.wrap{max-width:820px;margin:35px auto;padding:20px}.card{background:#141424;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px}label{display:block;margin:12px 0 6px;font-weight:800}input,textarea,select{width:100%;box-sizing:border-box;background:#0e0e18;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:11px;font-family:inherit}button{margin-top:16px;background:linear-gradient(135deg,#00d2ff,#8a2be2);color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:800;cursor:pointer}.muted{color:#a0a0c0}.warn{background:rgba(255,51,102,.1);border:1px solid #ff5172;padding:12px;border-radius:10px;margin:12px 0}.ok{background:rgba(0,230,118,.1);border:1px solid #00e676;padding:12px;border-radius:10px;margin:12px 0}</style></head><body><main class="wrap"><div style="margin-bottom:12px"><a href="my-products.html" style="color:#00d2ff;text-decoration:none;font-weight:800">← العودة إلى لوحة البائع</a></div><div class="card"><h1>✏️ تعديل المنتج</h1><div id="msg" class="muted">جاري التحميل...</div><form id="form" style="display:none"><div id="reason"></div><label>العنوان</label><input id="title" required><label>الوصف</label><textarea id="description" rows="5" required></textarea><label>السعر</label><input id="price" required><label>التصنيف</label><select id="category"><option value="books">📚 كتب وروايات</option><option value="models">🎨 مجسمات 3D/2D</option><option value="courses">🎓 دورات تعليمية</option><option value="gaming">🎮 ألعاب واشتراكات</option></select><label>صور المنتج</label><div id="imageUploadZone" style="border:2px dashed rgba(0,210,255,.4);border-radius:12px;padding:25px;text-align:center;cursor:pointer;background:rgba(0,210,255,.03)"><div style="font-size:2rem">🖼️</div><strong>اختر صوراً جديدة من الكمبيوتر أو الهاتف</strong><p class="muted">يمكنك إضافة حتى 8 صور، بحد أقصى 10 MB للصورة.</p><input id="productImages" type="file" accept="image/*" multiple hidden></div><div id="imageProgressWrap" style="display:none;margin-top:10px"><div style="height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden"><div id="imageProgressFill" style="height:100%;width:0%;background:linear-gradient(90deg,#00d2ff,#8a2be2)"></div></div><div id="imageProgressText" class="muted" style="text-align:center;margin-top:5px">0%</div></div><div id="imagePreviewGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px"></div><textarea id="imageUrls" rows="4" placeholder="يمكن أيضاً إضافة رابط صورة خارجي، رابط واحد في كل سطر" style="margin-top:10px"></textarea><p class="muted">الصور من جهازك تُرفع مباشرة إلى التخزين الآمن، ويمكن حذفها من المعاينة قبل الحفظ.</p><label>ملف المنتج <span style="color:#ffcc66">(مطلوب)</span></label><div id="uploadZone" style="border:2px dashed rgba(0,210,255,.4);border-radius:12px;padding:25px;text-align:center;cursor:pointer;background:rgba(0,210,255,.03)"><div style="font-size:2rem">☁️</div><strong id="fileLabel">اختيار ملف جديد (اختياري إذا كان الملف الحالي صحيحاً)</strong><p class="muted">يمكنك استبدال الملف مباشرة من DigiVault. الملفات الكبيرة تستخدم multipart upload.</p><input id="productFile" type="file" hidden></div><div id="progressWrap" style="display:none;margin-top:10px"><div style="height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden"><div id="progressFill" style="height:100%;width:0%;background:linear-gradient(90deg,#00d2ff,#8a2be2)"></div></div><div id="progressText" class="muted" style="text-align:center;margin-top:5px">0%</div></div><input id="downloadUrl" type="hidden"><input id="storageKey" type="hidden"><input id="fileName" type="hidden"><p id="uploadHint" class="muted">سيبقى الملف الحالي إذا لم تختر ملفاً جديداً.</p><button id="save">💾 حفظ وإعادة الإرسال للمراجعة</button></form></div></main><script type="module">import{auth,db,esc}from'./firebase-init.js';import{uploadProductFile,uploadProductImage}from'./b2-upload.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{doc,getDoc,updateDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);let product=null,uploadedImageUrls=[];const urls=v=>String(v||'').split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean);const isHttpUrl=v=>{try{const u=new URL(String(v).trim());return u.protocol==='https:'||u.protocol==='http:'}catch{return false}};function renderImages(){const g=$('imagePreviewGrid');g.innerHTML='';uploadedImageUrls.forEach((url,i)=>{const box=document.createElement('div');box.style.cssText='position:relative;background:#0a0a12;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px';const img=document.createElement('img');img.src=url;img.alt='صورة المنتج';img.style.cssText='width:100%;height:100px;object-fit:cover;border-radius:7px';const b=document.createElement('button');b.type='button';b.textContent='×';b.style.cssText='position:absolute;top:7px;left:7px;width:28px;height:28px;border:0;border-radius:50%;background:#ff4757;color:#fff;font-weight:900;cursor:pointer';b.onclick=()=>{uploadedImageUrls.splice(i,1);$('imageUrls').value=uploadedImageUrls.join('\n');renderImages()};box.append(img,b);g.append(box)})}async function handleImages(files){const list=[...files];if(uploadedImageUrls.length+list.length>8)return alert('يمكن إضافة 8 صور كحد أقصى.');$('save').disabled=true;$('imageProgressWrap').style.display='block';try{for(let i=0;i<list.length;i++){const f=list[i];const r=await uploadProductImage({user:auth.currentUser,file:f,onProgress:p=>{const overall=Math.round(((i)+(p/100))/list.length*100);$('imageProgressFill').style.width=overall+'%';$('imageProgressText').textContent=`رفع الصورة ${i+1} من ${list.length} — ${overall}%`}});uploadedImageUrls.push(r.downloadUrl);$('imageUrls').value=uploadedImageUrls.join('\n');renderImages()}$('imageProgressText').textContent='اكتمل رفع الصور ✓'}catch(e){alert(e.message||'تعذر رفع الصورة')}finally{$('save').disabled=false;$('productImages').value=''}}onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}if(!id){$('msg').textContent='معرّف المنتج غير موجود.';return}try{const snap=await getDoc(doc(db,'products',id));if(!snap.exists())throw new Error('المنتج غير موجود');product={id,...snap.data()};if(product.sellerEmail?.toLowerCase()!==u.email?.toLowerCase()){$('msg').textContent='لا تملك صلاحية تعديل هذا المنتج.';return}$('title').value=product.title||'';$('description').value=product.description||'';$('price').value=product.price||'';$('category').value=product.category||'books';uploadedImageUrls=(Array.isArray(product.imageUrls)?product.imageUrls:product.imageUrl?[product.imageUrl]:[]).filter(isHttpUrl);$('imageUrls').value=uploadedImageUrls.join('\n');renderImages();const fileSnap=await getDoc(doc(db,'product_files',id));if(fileSnap.exists()){const f=fileSnap.data();$('downloadUrl').value=f.downloadUrl||'';$('storageKey').value=f.storageKey||'';$('fileName').value=f.fileName||'';$('uploadHint').textContent=f.fileName?`الملف الحالي: ${f.fileName}`:'سيبقى الملف الحالي إذا لم تختر ملفاً جديداً.'}if(product.rejectionReason)$('reason').innerHTML=`<div class="warn"><strong>سبب الرفض:</strong> ${esc(product.rejectionReason)}<br><span class="muted">صحّح المشكلة ثم أرسل المنتج للمراجعة.</span></div>`;$('msg').textContent='عدّل البيانات ثم أعد إرسال المنتج للمراجعة.';$('form').style.display='block'}catch(e){$('msg').textContent='تعذر تحميل المنتج: '+e.message}});$('uploadZone').addEventListener('click',()=>$('productFile').click());$('productFile').addEventListener('change',e=>{if(e.target.files?.[0]){const file=e.target.files[0];$('fileLabel').textContent=`جاري رفع: ${file.name}`;$('save').disabled=true;$('progressWrap').style.display='block';uploadProductFile({user:auth.currentUser,file,onProgress:p=>{$('progressFill').style.width=p+'%';$('progressText').textContent=p+'%'}}).then(r=>{if(!r.downloadUrl)throw new Error('رابط التخزين العام غير مضبوط.');$('downloadUrl').value=r.downloadUrl;$('storageKey').value=r.key;$('fileName').value=r.fileName;$('uploadHint').textContent='تم رفع الملف الجديد بنجاح.';$('fileLabel').textContent=`✓ ${file.name}`}).catch(e=>{alert(e.message||'تعذر رفع الملف');$('productFile').value='';$('uploadHint').textContent='تعذر رفع الملف الجديد.'}).finally(()=>{$('save').disabled=false})}});$('imageUploadZone').addEventListener('click',()=>$('productImages').click());$('productImages').addEventListener('change',e=>{if(e.target.files?.length)handleImages(e.target.files)});$('imageUrls').addEventListener('input',()=>{uploadedImageUrls=urls($('imageUrls').value);renderImages()});$('form').addEventListener('submit',async e=>{e.preventDefault();const imageList=urls($('imageUrls').value),downloadUrl=$('downloadUrl').value.trim(),raw=$('price').value.trim();const free=/^(مجاني|مجانية|0+(?:[.,]0+)?)\$?$|^\$0+(?:[.,]0+)?$/i.test(raw.replace(/\s+/g,''));const price=free?'مجاني':raw;if(imageList.some(x=>!isHttpUrl(x)))return alert('كل روابط الصور يجب أن تبدأ بـ http:// أو https://');if(!downloadUrl)return alert('يجب أن يكون للمنتج ملف مرفوع.');if(!free&&(isNaN(parseFloat(price))||parseFloat(price)<0))return alert('السعر غير صالح.');$('save').disabled=true;try{await updateDoc(doc(db,'products',id),{title:$('title').value.trim(),description:$('description').value.trim(),price,category:$('category').value,imageUrl:imageList[0]||'',imageUrls:imageList,updatedAt:serverTimestamp(),status:'pending',rejectionReason:''});await setDoc(doc(db,'product_files',id),{downloadUrl,storageKey:$('storageKey').value,fileName:$('fileName').value||'ملف المنتج',deliveryType:'b2-worker',sellerEmail:product.sellerEmail,updatedAt:serverTimestamp()},{merge:true});location.href='my-products.html'}catch(err){alert('تعذر حفظ التعديل: '+err.message)}finally{$('save').disabled=false}});</script><script type="module" src="./site-enhance.js"></script></body></html>
