<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل المنتج | الخزنة الرقمية"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#0a0a12;color:#fff;font-family:Tajawal,sans-serif}.wrap{max-width:820px;margin:35px auto;padding:20px}.card{background:#141424;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px}label{display:block;margin:12px 0 6px;font-weight:800}input,textarea,select{width:100%;box-sizing:border-box;background:#0e0e18;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:11px;font-family:inherit}button{margin-top:16px;background:linear-gradient(135deg,#00d2ff,#8a2be2);color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:800;cursor:pointer}.muted{color:#a0a0c0}.warn{background:rgba(255,51,102,.1);border:1px solid #ff5172;padding:12px;border-radius:10px;margin:12px 0}.ok{background:rgba(0,230,118,.1);border:1px solid #00e676;padding:12px;border-radius:10px;margin:12px 0}</style></head><body><main class="wrap"><div style="margin-bottom:12px"><a href="my-products.html" style="color:#00d2ff;text-decoration:none;font-weight:800">← العودة إلى لوحة البائع</a></div><div class="card"><h1>✏️ تعديل المنتج</h1><div id="msg" class="muted">جاري التحميل...</div><form id="form" style="display:none"><div id="reason"></div><label>العنوان</label><input id="title" required><label>الوصف</label><textarea id="description" rows="5" required></textarea><label>السعر</label><input id="price" required><label>التصنيف</label><select id="category"><option value="books">📚 كتب وروايات</option><option value="models">🎨 مجسمات 3D/2D</option><option value="courses">🎓 دورات تعليمية</option><option value="gaming">🎮 ألعاب واشتراكات</option></select><label>روابط الصور</label><textarea id="imageUrls" rows="6" placeholder="رابط صورة واحد في كل سطر"></textarea><p class="muted">يمكنك حذف الروابط التي لا تريدها وإضافة روابط جديدة. لا يتم رفع الصور إلى Firebase.</p><label>رابط ملف المنتج <span style="color:#ffcc66">(مطلوب)</span></label><input id="downloadUrl" type="url" required><p class="muted">استخدم رابطاً عاماً مباشراً من R2 أو B2 أو خدمة تخزين خارجية.</p><button id="save">💾 حفظ وإعادة الإرسال للمراجعة</button></form></div></main><script type="module">import{auth,db,esc}from'./firebase-init.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{doc,getDoc,updateDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);let product=null;function isHttpUrl(v){try{const u=new URL(String(v).trim());return u.protocol==='https:'||u.protocol==='http:'}catch{return false}}function urls(v){return String(v||'').split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean)}onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}if(!id){$('msg').textContent='معرّف المنتج غير موجود.';return}try{const snap=await getDoc(doc(db,'products',id));if(!snap.exists())throw new Error('المنتج غير موجود');product={id,...snap.data()};if(product.sellerEmail?.toLowerCase()!==u.email?.toLowerCase()){$('msg').textContent='لا تملك صلاحية تعديل هذا المنتج.';return}$('title').value=product.title||'';$('description').value=product.description||'';$('price').value=product.price||'';$('category').value=product.category||'books';$('imageUrls').value=(Array.isArray(product.imageUrls)?product.imageUrls:product.imageUrl?[product.imageUrl]:[]).filter(isHttpUrl).join('\n');const fileSnap=await getDoc(doc(db,'product_files',id));if(fileSnap.exists())$('downloadUrl').value=fileSnap.data().downloadUrl||'';if(product.rejectionReason)$('reason').innerHTML=`<div class="warn"><strong>سبب الرفض:</strong> ${esc(product.rejectionReason)}<br><span class="muted">صحّح المشكلة ثم أرسل المنتج للمراجعة.</span></div>`;$('msg').textContent='عدّل البيانات ثم أعد إرسال المنتج للمراجعة.';$('form').style.display='block'}catch(e){$('msg').textContent='تعذر تحميل المنتج: '+e.message}});$('form').addEventListener('submit',async e=>{e.preventDefault();const imageList=urls($('imageUrls').value),downloadUrl=$('downloadUrl').value.trim(),raw=$('price').value.trim();const free=/^(مجاني|مجانية|0+(?:[.,]0+)?)\$?$|^\$0+(?:[.,]0+)?$/i.test(raw.replace(/\s+/g,''));const price=free?'مجاني':raw;if(imageList.some(x=>!isHttpUrl(x)))return alert('كل روابط الصور يجب أن تبدأ بـ http:// أو https://');if(!downloadUrl||!isHttpUrl(downloadUrl))return alert('ضع رابط ملف خارجي صالح.');if(!free&&(isNaN(parseFloat(price))||parseFloat(price)<0))return alert('السعر غير صالح.');$('save').disabled=true;try{await updateDoc(doc(db,'products',id),{title:$('title').value.trim(),description:$('description').value.trim(),price,category:$('category').value,imageUrl:imageList[0]||'',imageUrls:imageList,updatedAt:serverTimestamp(),status:'pending',rejectionReason:''});await setDoc(doc(db,'product_files',id),{downloadUrl,deliveryType:'external',sellerEmail:product.sellerEmail,updatedAt:serverTimestamp()},{merge:true});location.href='my-products.html'}catch(err){alert('تعذر حفظ التعديل: '+err.message)}finally{$('save').disabled=false}});</script><script type="module" src="./site-enhance.js"></script></body></html>
