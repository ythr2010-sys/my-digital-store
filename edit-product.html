<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1"><title>تعديل المنتج | الخزنة الرقمية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#0a0a12;color:#fff;font-family:Tajawal,sans-serif}.wrap{max-width:820px;margin:35px auto;padding:20px}.card{background:#141424;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px}label{display:block;margin:12px 0 6px;font-weight:800}input,textarea,select{width:100%;box-sizing:border-box;background:#0e0e18;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:11px;font-family:inherit}button{margin-top:16px;background:linear-gradient(135deg,#00d2ff,#8a2be2);color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:800;cursor:pointer}.muted{color:#a0a0c0}.warn{background:rgba(255,51,102,.1);border:1px solid #ff5172;padding:12px;border-radius:10px;margin:12px 0}.ok{background:rgba(0,230,118,.1);border:1px solid #00e676;padding:12px;border-radius:10px;margin:12px 0}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:110px;height:80px;object-fit:cover;border-radius:10px}</style></head><body><main class="wrap"><div style="margin-bottom:12px"><a href="my-products.html" style="color:#00d2ff;text-decoration:none;font-weight:800">← العودة إلى لوحة البائع</a></div><div class="card"><h1>✏️ تعديل المنتج</h1><div id="msg" class="muted">جاري التحميل...</div><form id="form" style="display:none"><div id="reason"></div><label>العنوان</label><input id="title" required><label>الوصف</label><textarea id="description" rows="5" required></textarea><label>السعر</label><input id="price" required><label>التصنيف</label><select id="category"><option value="books">📚 كتب وروايات</option><option value="models">🎨 مجسمات 3D/2D</option><option value="courses">🎓 دورات تعليمية</option><option value="gaming">🎮 ألعاب واشتراكات</option></select><label>صور إضافية من جهازك (اختياري)</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><div id="thumbs" class="thumbs"></div><label>رابط صورة إضافية (اختياري)</label><input id="imageUrl" type="url"><label>استبدال ملف المنتج من جهازك (اختياري)</label><input id="productFile" type="file"><p id="fileInfo" class="muted"></p><label>رابط ملف المنتج (بديل)</label><input id="downloadUrl" type="url"><p class="muted">عند تعديل منتج مرفوض، سيعود تلقائياً إلى «بانتظار المراجعة» بعد الحفظ.</p><button id="save">💾 حفظ وإعادة الإرسال للمراجعة</button></form></div></main><script type="module">
import {auth,db,storage} from './firebase-init.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{doc,getDoc,updateDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';import{ref as sref,uploadBytesResumable,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);let user=null,product=null,files=[];
const MAX_STORAGE_FILE=5*1024*1024*1024*1024, MAX_EMBED_FILE=700*1024;onAuthStateChanged(auth,async u=>{user=u;if(!u){location.href='login.html';return}if(!id){$('msg').textContent='معرّف المنتج غير موجود.';return}try{const snap=await getDoc(doc(db,'products',id));if(!snap.exists())throw new Error('المنتج غير موجود');product={id,...snap.data()};if(product.sellerEmail!==u.email){$('msg').textContent='لا تملك صلاحية تعديل هذا المنتج.';return}$('title').value=product.title||'';$('description').value=product.description||'';$('price').value=product.price||'';$('category').value=product.category||'books';$('imageUrl').value=product.imageUrl||'';loadFileInfo();if(product.rejectionReason)$('reason').innerHTML=`<div class="warn"><strong>سبب الرفض:</strong> ${esc(product.rejectionReason)}<br><span class="muted">صحّح المشكلة ثم أرسل المنتج للمراجعة.</span></div>`;renderThumbs(product.imageUrls||[]);$('msg').textContent='يمكنك الآن تعديل المنتج وحل الملاحظات.';$('form').style.display='block'}catch(e){$('msg').textContent='تعذر تحميل المنتج: '+e.message}});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderThumbs(urls){$('thumbs').innerHTML=urls.map(u=>`<img src="${esc(u)}">`).join('')}function loadFileInfo(){$('fileInfo').textContent='يمكنك الاحتفاظ بالملف الحالي أو اختيار ملف جديد. عند الحفظ سيعود المنتج للمراجعة.'}function upload(path,f){return new Promise((res,rej)=>{const t=uploadBytesResumable(storage,sref(storage,path),f);t.on('state_changed',()=>{},rej,async()=>{try{res(await getDownloadURL(t.snapshot.ref))}catch(e){rej(e)}})})}let selectedImages=[]; function addEditImages(list){const incoming=Array.from(list||[]).filter(f=>f.type.startsWith('image/'));const seen=new Set(selectedImages.map(f=>f.name+'|'+f.size));for(const f of incoming){const k=f.name+'|'+f.size;if(!seen.has(k)){selectedImages.push(f);seen.add(k)}}renderThumbs([...(product.imageUrls||[]),...selectedImages.map(f=>URL.createObjectURL(f))]);} $('images').addEventListener('change',()=>addEditImages($('images').files));$('productFile').addEventListener('change',()=>{const f=$('productFile').files[0];$('fileInfo').textContent=f?`📎 ${f.name} — ${(f.size/1024/1024).toFixed(2)} MB`:'لا يوجد ملف جديد'});$('form').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;try{const selected=selectedImages.length?selectedImages:[...$('images').files];let imageUrls=[...(product.imageUrls||[])];for(let i=0;i<selected.length;i++){try{imageUrls.push(await upload(`product-images/${id}/${Date.now()}_${i}_${selected[i].name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,selected[i]))}catch(err){if(selected[i].size>900*1024)throw new Error('Storage غير متاح والصورة الجديدة كبيرة. صغّرها أو فعّل Storage.');const r=new FileReader();const data=await new Promise((res,rej)=>{r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(selected[i])});imageUrls.push(data)}}const data={title:$('title').value.trim(),description:$('description').value.trim(),price:$('price').value.trim(),category:$('category').value,imageUrl:imageUrls[0]||$('imageUrl').value.trim()||'',imageUrls,updatedAt:serverTimestamp(),status:'pending',rejectionReason:''};await updateDoc(doc(db,'products',id),data);const newFile=$('productFile').files[0];const dl=$('downloadUrl').value.trim();if(newFile){let url=dl,type='external';try{url=await upload(`products/${id}/${Date.now()}_${newFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,newFile);type='storage'}catch(err){if(newFile.size>MAX_EMBED_FILE)throw new Error('الملف أكبر من حد التخزين المباشر في Firestore وStorage غير متاح. استخدم رابط تحميل أو فعّل Storage.');const r=new FileReader();url=await new Promise((res,rej)=>{r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(newFile)});type='embedded'}await updateDoc(doc(db,'product_files',id),{downloadUrl:url,fileName:newFile.name,deliveryType:type,updatedAt:serverTimestamp()})}else if(dl){await updateDoc(doc(db,'product_files',id),{downloadUrl:dl,deliveryType:'external',updatedAt:serverTimestamp()})}else{try{await updateDoc(doc(db,'products',id),{status:'pending',rejectionReason:''})}catch(_){}}location.href='my-products.html'}catch(err){alert('تعذر حفظ التعديل: '+err.message)}finally{$('save').disabled=false}});</script><script type="module" src="./site-enhance.js"></script></body></html>
