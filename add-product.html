<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج رقمي - DigiVault الخزنة الرقمية</title>
    <!-- Tailwind CSS للتصميم السريع والحديث -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .preview-box { border: 2px dashed #cbd5e1; transition: all 0.3s ease; }
        .preview-box:hover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar / رأس الصفحة -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-blue-600 flex items-center gap-2">
                <i class="fa-solid fa-vault"></i> DigiVault
            </a>
            <div class="flex items-center gap-3">
                <div id="adminLinkContainer" class="hidden">
                    <a href="admin.html" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-800 transition flex items-center gap-2">
                        <i class="fa-solid fa-gauge-high"></i> لوحة التحكم
                    </a>
                </div>
                <span id="userEmailBadge" class="text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full hidden"></span>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow max-w-2xl w-full mx-auto p-4 sm:p-6 my-8">
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <div class="mb-6 border-b pb-4">
                <h1 class="text-2xl font-extrabold text-slate-800">إضافة منتج رقمي جديد</h1>
                <p class="text-sm text-slate-500 mt-1">املأ بيانات المنتج بدقة ليكون جاهزاً للمراجعة والنشر.</p>
            </div>

            <!-- تنبيهات الحالة -->
            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

            <form id="productForm" class="space-y-5">
                <!-- عنوان المنتج -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">عنوان المنتج</label>
                    <input type="text" id="title" required placeholder="مثال: حزمة تصاميم UI/UX احترافية" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <!-- الوصف -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">وصف المنتج</label>
                    <textarea id="description" rows="4" required placeholder="اشرح مميزات وما يحصل عليه المشتري بالتحديد..." 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
                </div>

                <!-- السعر والفئة -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">السعر ($)</label>
                        <input type="number" id="price" step="0.01" min="0" required placeholder="0.00" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">التصنيف</label>
                        <select id="category" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                            <option value="design">تصاميم وجرافيك</option>
                            <option value="code">برمجيات وأكواد</option>
                            <option value="ebooks">كتب ومراجع</option>
                            <option value="courses">دورات تعليمية</option>
                        </select>
                    </div>
                </div>

                <!-- معاينة ورفع صورة الغلاف (ImgBB) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">صورة الغلاف</label>
                    <div class="preview-box rounded-xl p-4 text-center cursor-pointer relative" onclick="document.getElementById('coverImage').click()">
                        <input type="file" id="coverImage" accept="image/*" class="hidden" onchange="previewImage(this)">
                        <div id="imagePreviewContent" class="flex flex-col items-center justify-center py-4">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-500 mb-2"></i>
                            <span class="text-xs text-slate-600 font-medium">اضغط لاختيار صورة الغلاف أو اسحبها هنا</span>
                        </div>
                        <img id="imagePreviewTag" src="" alt="Preview" class="hidden max-h-48 mx-auto rounded-lg shadow-md object-contain">
                    </div>
                </div>

                <!-- رفع الملف الرقمي (Firebase Storage) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">ملف المنتج الرقمي (Zip, PDF, ...)</label>
                    <input type="file" id="digitalFile" required 
                        class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>

                <!-- شريط التقدم للرفع -->
                <div id="progressContainer" class="hidden space-y-2">
                    <div class="flex justify-between text-xs text-slate-600">
                        <span id="progressText">جاري الرفع...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> نشر المنتج للمراجعة
                </button>
            </form>
        </div>
    </main>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyYOUR_API_KEY_HERE",
            authDomain: "digivault-app.firebaseapp.com",
            projectId: "digivault-app",
            storageBucket: "digivault-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const IMGBB_API_KEY = "YOUR_IMGBB_API_KEY_HERE";
        const MAIN_ADMIN_EMAIL = "ythr2010@gmail.com";

        let currentUser = null;

        // التحقق من المصادقة والصلاحيات
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const helperAdmins = JSON.parse(localStorage.getItem('helperAdmins') || '[]');
            const badge = document.getElementById('userEmailBadge');
            
            if (user) {
                badge.innerText = user.email;
                badge.classList.remove('hidden');
                const isAdmin = user.email === MAIN_ADMIN_EMAIL || helperAdmins.includes(user.email);
                if (isAdmin) {
                    document.getElementById('adminLinkContainer').classList.remove('hidden');
                }
            } else {
                badge.classList.add('hidden');
                showAlert('يجب تسجيل الدخول أولاً لرفع المنتجات!', 'bg-amber-100 text-amber-800');
            }
        });

        // معاينة الصورة محلياً
        window.previewImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreviewTag').src = e.target.result;
                    document.getElementById('imagePreviewTag').classList.remove('hidden');
                    document.getElementById('imagePreviewContent').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        // رفع الصورة إلى ImgBB
        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!data.success) throw new Error('فشل رفع الصورة إلى ImgBB');
            return data.data.url;
        }

        // التعامل مع نموذج الإرسال
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showAlert('يرجى تسجيل الدخول قبل الإرسال.', 'bg-red-100 text-red-800');
                return;
            }

            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const category = document.getElementById('category').value;
            const coverFile = document.getElementById('coverImage').files[0];
            const digitalFile = document.getElementById('digitalFile').files[0];

            if (!coverFile) {
                showAlert('الرجاء اختيار صورة الغلاف.', 'bg-red-100 text-red-800');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري المعالجة...`;
            document.getElementById('progressContainer').classList.remove('hidden');

            try {
                // 1. رفع الصورة لـ ImgBB
                document.getElementById('progressText').innerText = 'جاري رفع صورة الغلاف...';
                document.getElementById('progressBar').style.width = '25%';
                document.getElementById('progressPercent').innerText = '25%';
                const imageUrl = await uploadImageToImgBB(coverFile);

                // 2. رفع الملف الرقمي لـ Firebase Storage
                document.getElementById('progressText').innerText = 'جاري رفع الملف الرقمي...';
                const fileRef = ref(storage, `products_files/${Date.now()}_${digitalFile.name}`);
                const uploadTask = uploadBytesResumable(fileRef, digitalFile);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 75) + 25;
                        document.getElementById('progressBar').style.width = progress + '%';
                        document.getElementById('progressPercent').innerText = progress + '%';
                    }, 
                    (error) => {
                        throw error;
                    }, 
                    async () => {
                        const downloadUrl = await getDownloadURL(uploadTask.snapshot.ref);

                        // 3. حفظ بيانات المنتج في Firestore
                        await addDoc(collection(db, "products"), {
                            title,
                            description,
                            price,
                            category,
                            imageUrl,
                            downloadUrl,
                            status: 'pending',
                            sellerId: currentUser.uid,
                            sellerEmail: currentUser.email,
                            createdAt: serverTimestamp()
                        });

                        showAlert('تم إرسال المنتج بنجاح وهو بانتظار موافقة المدير.', 'bg-emerald-100 text-emerald-800');
                        document.getElementById('productForm').reset();
                        document.getElementById('imagePreviewTag').classList.add('hidden');
                        document.getElementById('imagePreviewContent').classList.remove('hidden');
                        document.getElementById('progressContainer').classList.add('hidden');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> نشر المنتج للمراجعة`;
                    }
                );

            } catch (err) {
                console.error(err);
                showAlert('حدث خطأ أثناء الرفع: ' + err.message, 'bg-red-100 text-red-800');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> نشر المنتج للمراجعة`;
                document.getElementById('progressContainer').classList.add('hidden');
            }
        });

        function showAlert(msg, colorClass) {
            const box = document.getElementById('alertBox');
            box.className = `mb-6 p-4 rounded-xl text-sm font-medium ${colorClass}`;
            box.innerText = msg;
            box.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
