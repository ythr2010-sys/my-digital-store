<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج جديد | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        /* ضمان ظهور القائمة بشكل واضح ومرتب فوق الخلفية */
        .add-product-wrapper {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--card-bg, #1e293b);
            border-radius: 12px;
            border: 1px solid var(--border-color, #334155);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-weight: bold;
            color: var(--text-color, #f8fafc);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
        }
        .form-group input[type="file"] {
            padding: 8px;
            background-color: #1e293b;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html">الخزنة<span>الرقمية</span></a></div>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="terms.html">الشروط</a>
        </div>
    </header>

    <main class="container">
        <div class="add-product-wrapper">
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 style="font-size: 1.8rem; color: #fff;">إضافة منتج رقمي للبيع</h2>
                <p style="color: #94a3b8; font-size: 0.95rem;">قم بعرض منتجك للبيع واكسب 90% من كل عملية بيع</p>
            </div>

            <form id="addProductForm">
                <div class="form-group">
                    <label for="productTitle">عنوان المنتج</label>
                    <input type="text" id="productTitle" placeholder="مثال: حساب لعبة / كود تفعيل / كتاب" required>
                </div>

                <div class="form-group">
                    <label for="productPrice">السعر ($)</label>
                    <input type="number" id="productPrice" placeholder="10.00" step="0.01" min="1" required>
                    <small id="commissionNotice" style="color: #38bdf8; font-size: 0.85rem;">
                        * عمولة المنصة (10%): $0.00 | صافي ربحك: $0.00
                    </small>
                </div>

                <div class="form-group">
                    <label for="productDesc">وصف المنتج</label>
                    <textarea id="productDesc" rows="4" placeholder="اكتب تفاصيل ومميزات المنتج..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="productImage">صورة الغلاف (PNG / JPG)</label>
                    <input type="file" id="productImage" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label for="productFile">ملف المنتج الرقمي (Zip / PDF)</label>
                    <input type="file" id="productFile" accept=".zip,.pdf,.rar,.txt" required>
                </div>

                <div class="form-group">
                    <label for="payoutDetails">بيانات حسابك لاستلام الأرباح (PayPal / CCP / Wise)</label>
                    <input type="text" id="payoutDetails" placeholder="أدخل رقم الحساب أو البريد الإلكتروني" required>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;">نشر المنتج للبيع</button>
                <p id="statusMessage" style="text-align: center; margin-top: 15px; font-size: 0.95rem; font-weight: 500;"></p>
            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClXL28rqPQr--pUu3N_Y-X3ihXEAKOyg8",
            authDomain: "digivault-4c3a3.firebaseapp.com",
            projectId: "digivault-4c3a3",
            storageBucket: "digivault-4c3a3.firebasestorage.app",
            messagingSenderId: "578335534171",
            appId: "1:578335534171:web:1b108a849c0543f998a37e",
            measurementId: "G-SZCB59ZZDN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // حاسبة العمولة
        const priceInput = document.getElementById('productPrice');
        const commissionNotice = document.getElementById('commissionNotice');

        priceInput.addEventListener('input', () => {
            const price = parseFloat(priceInput.value) || 0;
            const fee = (price * 0.10).toFixed(2);
            const profit = (price - fee).toFixed(2);
            commissionNotice.innerText = `* عمولة المنصة (10%): $${fee} | صافي ربحك: $${profit}`;
        });

        // معالجة نموذج الإرسال
        const addProductForm = document.getElementById('addProductForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const imageFileInput = document.getElementById('productImage');
            const digitalFileInput = document.getElementById('productFile');

            if (!imageFileInput.files[0] || !digitalFileInput.files[0]) {
                statusMessage.style.color = "#ef4444";
                statusMessage.innerText = "يرجى اختيار صورة الغلاف والملف الرقمي أولاً.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري رفع الملفات ونشر المنتج...";
            statusMessage.style.color = "#38bdf8";
            statusMessage.innerText = "يرجى الانتظار، يتم رفع الملفات إلى الخادم...";

            try {
                const title = document.getElementById('productTitle').value;
                const price = parseFloat(document.getElementById('productPrice').value);
                const desc = document.getElementById('productDesc').value;
                const payout = document.getElementById('payoutDetails').value;
                
                const imageFile = imageFileInput.files[0];
                const digitalFile = digitalFileInput.files[0];

                // 1. رفع الصورة
                const imageRef = ref(storage, `images/${Date.now()}_${imageFile.name}`);
                await uploadBytes(imageRef, imageFile);
                const imageUrl = await getDownloadURL(imageRef);

                // 2. رفع الملف الرقمي
                const fileRef = ref(storage, `products/${Date.now()}_${digitalFile.name}`);
                await uploadBytes(fileRef, digitalFile);
                const fileUrl = await getDownloadURL(fileRef);

                // 3. التخزين في Firestore
                await addDoc(collection(db, "products"), {
                    title: title,
                    price: price,
                    platformFee: price * 0.10,
                    sellerProfit: price * 0.90,
                    description: desc,
                    imageUrl: imageUrl,
                    downloadUrl: fileUrl,
                    payoutDetails: payout,
                    createdAt: serverTimestamp()
                });

                statusMessage.style.color = "#10b981";
                statusMessage.innerText = "تم نشر منتجك بنجاح! سيظهر الآن في المتجر.";
                addProductForm.reset();
                commissionNotice.innerText = "* عمولة المنصة (10%): $0.00 | صافي ربحك: $0.00";

            } catch (error) {
                console.error("Error adding product: ", error);
                statusMessage.style.color = "#ef4444";
                statusMessage.innerText = "حدث خطأ أثناء الرفع: " + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "نشر المنتج للبيع";
            }
        });
    </script>

    <footer style="text-align: center; padding: 20px; color: #64748b; margin-top: 40px;">
        <p>جميع الحقوق محفوظة © 2026 الخزنة الرقمية (DigiVault)</p>
    </footer>
</body>
</html>
