<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج جديد | الخزنة الرقمية DigiVault</title>
    
    <!-- الخطوط الخارجية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .page-wrapper {
            display: flex;
            flex: 1;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-line);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo a {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .logo a span { color: var(--accent-cyan); }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-sub);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-cyan);
            border-right: 3px solid var(--accent-cyan);
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--accent-cyan);
            border-right: 4px solid var(--accent-cyan);
            padding-right: 10px;
        }

        .form-card p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            background: #0d0d18;
            border: 1px solid var(--border-line);
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success-green);
            color: var(--success-green);
        }

        .alert-error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
        }

        @media (max-width: 768px) {
            .page-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .form-row { grid-template-columns: 1fr; }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
        <!-- القائمة الجانبية -->
        <aside class="sidebar">
            <div class="logo">
                <a href="index.html">الخزنة<span>الرقمية</span></a>
            </div>
            <nav>
                <ul class="sidebar-menu">
                    <li><a href="index.html">🏠 الصفحة الرئيسية</a></li>
                    <li><a href="add-product.html" class="active">➕ أضف منتجك للبيع</a></li>
                    <li><a href="shop.html">🛍️ تسوق الآن</a></li>
                    <li><a href="contact.html">📩 تواصل معنا</a></li>
                </ul>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <div class="form-card">
                <h1>إضافة منتج جديد للبيع 📦</h1>
                <p>قم بملء البيانات التالية لنشر منتجك الرقمي في متجر الخزنة الرقمية فوراً.</p>

                <div id="alertBox" class="alert-box"></div>

                <form id="addProductForm">
                    <div class="form-group">
                        <label for="productTitle">عنوان المنتج *</label>
                        <input type="text" id="productTitle" placeholder="مثال: كتاب أساسيات برمجة Python أو مجسم 3D لسيارة" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productPrice">السعر (بالدولار $) *</label>
                            <input type="number" id="productPrice" step="0.01" min="0" placeholder="مثال: 9.99" required>
                        </div>

                        <div class="form-group">
                            <label for="productCategory">فئة المنتج *</label>
                            <select id="productCategory" required>
                                <option value="books">📚 كتب وروايات</option>
                                <option value="models">🎨 مجسمات 3D & 2D</option>
                                <option value="courses">🎓 دورات تعليمية</option>
                                <option value="gaming">🎮 ألعاب واشتراكات</option>
                                <option value="other">💡 خدمات ومنتجات أخرى</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="productImage">رابط صورة المعاينة (URL) *</label>
                        <input type="url" id="productImage" placeholder="https://example.com/image.jpg" required>
                    </div>

                    <div class="form-group">
                        <label for="productDownload">رابط تحميل الملف أو الخدمة (URL) *</label>
                        <input type="url" id="productDownload" placeholder="رابط Google Drive, Mega, أو رابط المادة الرقمية" required>
                    </div>

                    <div class="form-group">
                        <label for="productDescription">وصف المنتج التفصيلي *</label>
                        <textarea id="productDescription" rows="4" placeholder="اكتب شرحاً وافياً عن المميزات المحتواة في المنتج..." required></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">نشر المنتج في المتجر 🚀</button>
                </form>
            </div>
        </main>
    </div>

    <!-- سكريبت الربط بـ Firebase Auth & Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClXL28rqPQr--pUu3N_Y-X3ihXEAKOyg8",
            authDomain: "digivault-4c3a3.firebaseapp.com",
            projectId: "digivault-4c3a3",
            storageBucket: "digivault-4c3a3.firebasestorage.app",
            messagingSenderId: "578335534171",
            appId: "1:578335534171:web:1b108a849c0543f998a37e",
            measurementId: "G-SZCB59ZZDN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // التحقق من حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                showAlert("يجب عليك تسجيل الدخول أولاً لتتمكن من إضافة المنتجات.", "error");
            }
        });

        const form = document.getElementById("addProductForm");
        const submitBtn = document.getElementById("submitBtn");
        const alertBox = document.getElementById("alertBox");

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert-box ${type === 'success' ? 'alert-success' : 'alert-error'}`;
            alertBox.style.display = 'block';
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!currentUser) {
                showAlert("عفواً، يتوجب عليك تسجيل الدخول للحساب أولاً!", "error");
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
                return;
            }

            const title = document.getElementById("productTitle").value.trim();
            const price = parseFloat(document.getElementById("productPrice").value);
            const category = document.getElementById("productCategory").value;
            const imageUrl = document.getElementById("productImage").value.trim();
            const downloadUrl = document.getElementById("productDownload").value.trim();
            const description = document.getElementById("productDescription").value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الحفظ في Firestore...";

            try {
                // حفظ البيانات في كولكشن products في Firestore
                await addDoc(collection(db, "products"), {
                    title: title,
                    price: price,
                    category: category,
                    imageUrl: imageUrl,
                    downloadUrl: downloadUrl,
                    description: description,
                    sellerEmail: currentUser.email,
                    sellerUid: currentUser.uid,
                    createdAt: serverTimestamp()
                });

                showAlert("تم إضافة المنتج بنجاح! سيظهر الآن تلقائياً في الصفحة الرئيسية وفي لوحة التحكم.", "success");
                form.reset();

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (error) {
                console.error("خطأ أثناء حفظ المنتج:", error);
                showAlert("حدث خطأ أثناء حفظ البيانات: " + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "نشر المنتج في المتجر 🚀";
            }
        });
    </script>
</body>
</html>
