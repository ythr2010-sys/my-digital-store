<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشترياتي وملفاتي | الخزنة الرقمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --accent-cyan: #00d2ff;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --danger-red: #ff4757;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo a {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo a span {
            color: var(--accent-cyan);
        }

        .nav-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            opacity: 0.8;
        }

        .main-wrapper {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            height: fit-content;
        }

        .container h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 25px;
            border-right: 4px solid var(--accent-cyan);
            padding-right: 12px;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-line);
            border-radius: 10px;
            transition: border-color 0.2s;
        }

        .order-item-row:hover {
            border-color: rgba(0, 210, 255, 0.3);
        }

        .order-info strong {
            display: block;
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .order-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .badge-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-cyan);
            margin-right: 6px;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent-cyan), #8a2be2);
            color: white;
            padding: 9px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
        }

        .status-message {
            text-align: center;
            padding: 30px;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border-line);
            color: var(--text-sub);
            font-size: 0.9rem;
            background: var(--bg-card);
        }

        @media (max-width: 600px) {
            .order-item-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-download {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html">الخزنة <span>الرقمية</span></a></div>
        <a href="index.html" class="nav-link">الرئيسية</a>
    </header>

    <div class="main-wrapper">
        <div class="container">
            <h2>مشترياتي وملفاتي الرقمية</h2>
            <div id="myPurchasesList" class="status-message">جاري تحميل المشتريات...</div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 الخزنة الرقمية (DigiVault)</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClXL28rqPQr--pUu3N_Y-X3ihXEAKOyg8",
            authDomain: "digivault-4c3a3.firebaseapp.com",
            projectId: "digivault-4c3a3",
            storageBucket: "digivault-4c3a3.firebasestorage.app",
            messagingSenderId: "578335534171",
            appId: "1:578335534171:web:1b108a849c0543f998a37e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadPurchasesFromFirebase() {
            const container = document.getElementById("myPurchasesList");
            const rawProfile = localStorage.getItem("userProfile");
            let userProfile = null;

            try {
                userProfile = rawProfile ? JSON.parse(rawProfile) : null;
            } catch (e) {
                console.error("خطأ في قراءة ملف المستخدم من التخزين المحلي:", e);
            }
            
            if (!userProfile || !userProfile.email) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <p style="margin-bottom: 15px;">قم بتسجيل الدخول لعرض مشترياتك وملفاتك الرقمية.</p>
                        <a href="login.html" class="btn-download" style="display:inline-flex;">تسجيل الدخول</a>
                    </div>
                `;
                return;
            }

            try {
                const q = query(collection(db, "orders"), where("buyerEmail", "==", userProfile.email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = "<p>لا توجد طلبات سابقة لهذا الحساب حتى الآن.</p>";
                    return;
                }

                let html = '<div class="orders-list">';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const items = data.items || [];
                    
                    items.forEach(item => {
                        const fileLink = item.downloadUrl || data.downloadUrl;
                        const isLinkValid = fileLink && fileLink.startsWith('http');
                        const paymentMethod = data.paymentMethod || 'البطاقة الذهبية';
                        const status = data.status || 'مكتمل';

                        html += `
                            <div class="order-item-row">
                                <div class="order-info">
                                    <strong>${item.name || item.title || 'منتج رقمي'}</strong>
                                    <div class="order-meta">
                                        <span class="badge-status">${status}</span>
                                        طريقة الدفع: ${paymentMethod}
                                    </div>
                                </div>
                                ${isLinkValid 
                                    ? `<a href="${fileLink}" target="_blank" rel="noopener noreferrer" class="btn-download">تنزيل الملف 📥</a>` 
                                    : `<span style="color:var(--text-sub); font-size:0.85rem;">قيد التجهيز من الإدارة</span>`}
                            </div>
                        `;
                    });
                });
                html += '</div>';

                container.className = ""; // إزالة كلاس الرسالة الافتراضية
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p style='color:var(--danger-red);'>تعذر تحميل الطلبات الحالية، تحقق من الاتصال بالإنترنت.</p>";
            }
        }

        window.addEventListener("DOMContentLoaded", loadPurchasesFromFirebase);
    </script>
</body>
</html>
