<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشترياتي - DigiVault</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #475569;
            --danger-red: #ef4444;
            --primary: #2563eb;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .order-item-row:last-child {
            border-bottom: none;
        }
        .btn-download {
            background-color: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مشترياتي وملفاتي الرقمية</h2>
        <div id="myPurchasesList">جاري تحميل المشتريات...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClXL28rqPQr--pUu3N_Y-X3ihXEAKOyg8",
            authDomain: "digivault-4c3a3.firebaseapp.com",
            projectId: "digivault-4c3a3",
            storageBucket: "digivault-4c3a3.firebasestorage.app",
            messagingSenderId: "578335534171",
            appId: "1:578335534171:web:1b108a849c0543f998a37e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadPurchasesFromFirebase() {
            const container = document.getElementById("myPurchasesList");
            const userProfile = JSON.parse(localStorage.getItem("userProfile"));
            
            if (!userProfile || !userProfile.email) {
                container.innerHTML = "<p style='color:var(--text-sub); text-align:center;'>قم بتسجيل الدخول لعرض مشترياتك وملفاتك الرقمية.</p>";
                return;
            }

            try {
                const q = query(collection(db, "orders"), where("buyerEmail", "==", userProfile.email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color:var(--text-sub); text-align:center;'>لا توجد طلبات سابقة لهذا الحساب.</p>";
                    return;
                }

                let html = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const items = data.items || [];
                    
                    items.forEach(item => {
                        const fileLink = item.downloadUrl || data.downloadUrl || "#";
                        const isLinkValid = fileLink && fileLink !== "#";
                        html += `
                            <div class="order-item-row">
                                <div>
                                    <strong>${item.name || item.title || 'منتج رقمي'}</strong>
                                    <div style="font-size:0.85rem; color:var(--text-sub);">طريقة الدفع: ${data.paymentMethod || 'الذهبية'} | الحالة: ${data.status || 'مكتمل'}</div>
                                </div>
                                ${isLinkValid 
                                    ? `<a href="${fileLink}" target="_blank" class="btn-download">تنزيل الملف 📥</a>` 
                                    : `<span style="color:var(--text-sub); font-size:0.85rem;">قيد التجهيز من الإدارة</span>`}
                            </div>
                        `;
                    });
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p style='color:var(--danger-red); text-align:center;'>تعذر تحميل الطلبات الحالية.</p>";
            }
        }

        window.addEventListener("DOMContentLoaded", loadPurchasesFromFirebase);
    </script>
</body>
</html>
