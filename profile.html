<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات والحساب | الخزنة الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a12;
            --bg-card: #141424;
            --bg-sidebar: #10101c;
            --accent-cyan: #00d2ff;
            --accent-purple: #8a2be2;
            --border-line: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        .page-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-line);
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 12px; color: var(--text-sub);
            text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; transition: 0.3s;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); border-right: 3px solid var(--accent-cyan);
        }

        .main-content { flex: 1; padding: 30px; max-width: 900px; }

        .cart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-line);
        }

        .btn-remove {
            background: rgba(255, 0, 0, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-checkout {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            text-decoration: none;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .page-wrapper { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo"><a href="index.html" style="font-size:1.5rem; font-weight:900; color:#fff; text-decoration:none;">الخزنة<span style="color:var(--accent-cyan);">الرقمية</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">🏠 الصفحة الرئيسية</a></li>
                <li><a href="shop.html">🛍️ تسوق الآن (المنتجات)</a></li>
                <li><a href="contact.html">📩 تواصل معنا والأسئلة</a></li>
                <li><a href="profile.html" class="active">🛒 سلة المشتريات</a></li>
                <li><a href="privacy.html">🔒 سياسة الخصوصية</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 25px; font-size: 1.8rem;">سلة المشتريات 🛒</h1>

            <div class="cart-card">
                <div id="cartList">
                    <!-- المشتريات تظهر هنا -->
                </div>
                <a href="checkout.html" class="btn-checkout" id="checkoutBtn">الانتقال لإتمام الدفع 💳</a>
            </div>
        </main>
    </div>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const container = document.getElementById("cartList");
            const btn = document.getElementById("checkoutBtn");

            if (cart.length === 0) {
                container.innerHTML = "<p style='color:var(--text-sub); text-align:center; padding:20px;'>سلة المشتريات فارغة حالياً.</p>";
                btn.style.display = "none";
                return;
            }

            btn.style.display = "block";
            container.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong>
                        <div style="color:var(--accent-cyan); font-weight:bold;">${item.price}</div>
                    </div>
                    <button class="btn-remove" onclick="removeItem(${index})">حذف 🗑️</button>
                </div>
            `).join('');
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        }

        document.addEventListener("DOMContentLoaded", renderCart);
    </script>
</body>
</html>
